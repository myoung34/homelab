customization:
  extraKernelArgs:
    - talos.logging.kernel=tcp://192.168.3.2:5046/
    - selinux=0
    # ADATA NVMe (1cc1:5236) drops off the bus via APST/ASPM (D3cold -> D0 fails).
    - nvme_core.default_ps_max_latency_us=0
    - pcie_aspm=off
    - pcie_port_pm=off
  systemExtensions:
    officialExtensions:
      - siderolabs/amd-ucode
      - siderolabs/amdgpu
      - siderolabs/iscsi-tools
      - siderolabs/tailscale
