apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: node-feature-discovery

resources:
  - namespace.yaml

helmCharts:
- name: node-feature-discovery
  includeCRDs: true
  namespace: node-feature-discovery
  releaseName: node-feature-discovery
  version: 0.19.0
  repo: https://kubernetes-sigs.github.io/node-feature-discovery/charts
  valuesInline:
    master:
      resources:
        requests:
          cpu: 15m
          memory: 105M
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
    # The worker runs on every node (including amd64 cluster41) so its
    # hardware gets labelled; see k8s/prod/amdgpu-device-plugin/nodefeaturerule.yaml.
    worker:
      resources:
        requests:
          cpu: 5m
          memory: 105M
    gc:
      resources:
        requests:
          cpu: 15m
          memory: 105M
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64

patches:
  - target:
      kind: ConfigMap
      name: node-feature-discovery-worker-conf
    patch: |-
      - op: replace
        path: /data/nfd-worker.conf
        value: |-
          sources:
            usb:
              deviceClassWhitelist:
                - "02"
                - "08"
                - "0e"
                - "ef"
                - "fe"
                - "ff"
              deviceLabelFields:
                - "class"
                - "vendor"
                - "device"
            pci:
              deviceLabelFields:
                - "class"
                - "vendor"
                - "device"
                - "subsystem_vendor"
                - "subsystem_device"
