apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level namespace: kustomize doesn't know NodeFeatureRule is
# cluster-scoped and would stamp one onto it. The chart is namespaced via
# helmCharts[].namespace below, and namespace.yaml names itself.

resources:
  - namespace.yaml
  - amd-gpu-nodefeaturerule.yaml
  - nvidia-gpu-nodefeaturerule.yaml
  - zwave-usb-nodefeaturerule.yaml

helmCharts:
- name: node-feature-discovery
  includeCRDs: true
  namespace: node-feature-discovery
  releaseName: node-feature-discovery
  version: 0.20.0
  repo: https://kubernetes-sigs.github.io/node-feature-discovery/charts
  valuesInline:
    master:
      # For zwave-usb-nodefeaturerule.yaml.
      enableTaints: true
      resources:
        requests:
          cpu: 15m
          memory: 105M
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
    # The worker runs on every node (including amd64 cluster41) so its
    # hardware gets labelled; see amd-gpu-nodefeaturerule.yaml.
    worker:
      resources:
        requests:
          cpu: 5m
          memory: 105M
      # Keep labelling the Z-Wave node, or ser2net's affinity label disappears.
      # Ride out io-pressure too: a worker that can't reschedule onto a stalled
      # node leaves its labels stale, and ser2net follows a stick that moved.
      tolerations:
        - key: homelab/zwave-usb
          operator: Exists
          effect: NoSchedule
        - key: homelab/io-pressure
          operator: Exists
          effect: NoSchedule
    gc:
      resources:
        requests:
          cpu: 15m
          memory: 105M
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64

patches:
  - target:
      kind: ConfigMap
      name: node-feature-discovery-worker-conf
    patch: |-
      - op: replace
        path: /data/nfd-worker.conf
        value: |-
          sources:
            usb:
              deviceClassWhitelist:
                - "02"
                - "08"
                - "0e"
                - "ef"
                - "fe"
                - "ff"
              deviceLabelFields:
                - "class"
                - "vendor"
                - "device"
            pci:
              deviceLabelFields:
                - "class"
                - "vendor"
                - "device"
                - "subsystem_vendor"
                - "subsystem_device"
