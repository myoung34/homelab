apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/name: jellyfin
  name: jellyfin
spec:
  ports:
  - name: http
    port: 8096
    protocol: TCP
    targetPort: 8096
  selector:
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/name: jellyfin
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: jellyfin
    app.kubernetes.io/name: jellyfin
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: jellyfin
      app.kubernetes.io/name: jellyfin
  # hostNetwork binds :8096 on the node, so two pods can't overlap.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: jellyfin
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      # cluster41 is the only amd64 node with real CPU (12 cores, 32 GB);
      # the rest are 4-8 GB arm64 boards. No GPU: ollama holds both the
      # NVIDIA and AMD cards through the device plugins, so transcoding is
      # CPU-only.
      nodeSelector:
        kubernetes.io/hostname: cluster41
      # LAN clients (TVs) reach 192.168.1.32:8096 directly and find the
      # server by UDP 7359 discovery, same pattern as hass.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:12.4
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "America/Chicago"
        # What clients are told to use when they ask for the server URL.
        - name: JELLYFIN_PublishedServerUrl
          value: https://media.king-gila.ts.net
        ports:
        - containerPort: 8096
          name: http
          protocol: TCP
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8096
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8096
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: 8096
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /cache
          name: cache
        - mountPath: /media
          name: media
          readOnly: true
      volumes:
      # Jellyfin's SQLite DB stays on Longhorn; the NAS mount is NFSv3
      # nolock, which SQLite doesn't survive.
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      # Transcodes and image cache; rebuilt on demand.
      - name: cache
        emptyDir: {}
      # Read-only: libraries are movies/ and tv/. torrents/ is visible but
      # not a library, since its files are hardlinked into movies/.
      - name: media
        nfs:
          server: 192.168.3.2
          path: /volume1/Media
          readOnly: true
