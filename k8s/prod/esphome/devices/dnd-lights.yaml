esphome:
  name: dnd_lights
  friendly_name: dnd_lights

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

logger:

web_server:
  port: 80

bluetooth_proxy:
  active: True

api:
  encryption:
    key: !secret dnd_lights_key

ota:
- platform: esphome
  password: !secret ota_password

switch:
  - platform: gpio
    id: lights
    name: "Lights"
    pin:
      number: GPIO10
      inverted: false
      mode:
        output: true
