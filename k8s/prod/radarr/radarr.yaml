apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/name: radarr
  name: radarr
spec:
  ports:
  - name: http
    port: 7878
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/name: radarr
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: radarr
    app.kubernetes.io/name: radarr
  name: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: radarr
      app.kubernetes.io/name: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: radarr
        app.kubernetes.io/name: radarr
    spec:
      automountServiceAccountToken: true
      serviceAccountName: default
      containers:
      - name: radarr
        image: lscr.io/linuxserver/radarr:6.4.4
        imagePullPolicy: IfNotPresent
        env:
        # Matches myoung:users. The share squashes every write to admin:users
        # anyway, so this only matters if that squash is ever turned off.
        - name: PUID
          value: "1026"
        - name: PGID
          value: "100"
        - name: UMASK
          value: "002"
        - name: TZ
          value: "America/Chicago"
        ports:
        - containerPort: 7878
          name: http
          protocol: TCP
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /media
          name: media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: radarr-config
      # Same export, same mount path as rtorrent: rtorrent writes
      # /media/torrents/, radarr imports into /media/movies/. One mount, so the
      # import is a hardlink, and no remote path mapping is needed.
      - name: media
        nfs:
          server: 192.168.3.2
          path: /volume1/Media
