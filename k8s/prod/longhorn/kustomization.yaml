apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

resources:
  - namespace.yaml
  - tailscale.yaml
  - vault.yaml
  - backuptargets.yaml
  - recurringjobs.yaml
  - zigbee2mqtt.yaml
  - zigbee2mqtt-upstairs.yaml
  - zwave-js-ui.yaml
  - hass.yaml
  - paperless.yaml
  - network-optimizer.yaml
  - klipper-enderright.yaml

patches:
  - target:
      kind: Job
      name: longhorn-pre-upgrade
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Skip
  - target:
      kind: Job
      name: longhorn-uninstall
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Skip
  - target:
      kind: Job
      name: longhorn-post-upgrade
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Skip

helmCharts:
- name: longhorn
  releaseName: longhorn
  version: 1.12.0
  includeCRDs: true
  repo: https://charts.longhorn.io
  valuesInline:
    longhornUI:
      replicas: 1
    csi:
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
      provisionerReplicaCount: 1
      attacherReplicaCount: 1
    persistence:
      defaultDataLocality: "best-effort"
    defaultSettings:
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
