apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system

resources:
  - namespace.yaml
  - tailscale.yaml
  - vault.yaml
  - backuptargets.yaml
  - recurringjobs.yaml
  - storageclass-1r.yaml
  - zigbee2mqtt.yaml
  - zigbee2mqtt-upstairs.yaml
  - zwave-js-ui.yaml
  - hass.yaml
  - paperless.yaml
  - network-optimizer.yaml
  #- klipper-enderright.yaml
  - klipper-enderleft.yaml
  - klipper-enderbig.yaml

patches:
  - target:
      kind: Job
      name: longhorn-pre-upgrade
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Skip
  - target:
      kind: Job
      name: longhorn-uninstall
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Skip
  - target:
      kind: Job
      name: longhorn-post-upgrade
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Skip

helmCharts:
- name: longhorn
  releaseName: longhorn
  version: 1.13.0
  includeCRDs: true
  repo: https://charts.longhorn.io
  valuesInline:
    longhornUI:
      replicas: 1
    csi:
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
      provisionerReplicaCount: 1
      attacherReplicaCount: 1
    persistence:
      defaultDataLocality: "best-effort"
    defaultSettings:
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      # Only create a default disk on nodes labelled
      # node.longhorn.io/create-default-disk. Talos sets it on every worker:
      # "true" (disk at /var/lib/longhorn) or "config" plus a
      # default-disks-config annotation (disk at /var/mnt/longhorn, the
      # dedicated user volume). See terraform/talos/templates/longhorn*.tmpl.
      createDefaultDiskLabeledNodes: true
      # Longhorn reserves this percentage of every node's CPU as a hard request
      # on each instance-manager pod. The default is 12, which on a ~4-core Pi
      # is 474m of 3950m. cluster14 sits at 3703m requested, leaving 247m, so
      # its instance-manager has been failing to schedule in a ~2 minute
      # OutOfcpu loop:
      #
      #   Node didn't have enough resource: cpu,
      #   requested: 474, used: 3703, capacity: 3950
      #
      # 8% is 316m, which fits. This is a reservation, not a limit - the
      # instance-managers were not using 12%, it was merely held for them.
      # Existing instance-manager pods keep the old request until they restart.
      guaranteedInstanceManagerCpu: 8
      # Spread replicas off over-loaded nodes instead of leaving them where they
      # first landed. cluster11 is the probe-failure epicentre (~3100 liveness/
      # readiness timeouts on 4s `ls /data/longhorn`), which points at disk
      # contention that replica placement is contributing to.
      #
      # least-effort rather than best-effort on purpose: it moves the minimum
      # number of replicas needed to relieve imbalance, and every move is a
      # replica rebuild - sustained disk I/O on nodes that are already slow.
      # best-effort would optimise harder and rebuild more.
      replicaAutoBalance: least-effort
