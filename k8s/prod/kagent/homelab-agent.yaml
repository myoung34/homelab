---
# The one agent. It was two: homelab-agent (this file, Aperture tools only)
# and k8s-agent (from the chart's subchart, cluster tools only, with its
# systemMessage replaced by a patch in kustomization.yaml because the
# chart's own text was wrong for how we run it).
#
# Splitting them cost more than it bought. Neither half could finish a real
# question on its own: diagnosing a workload means reading the cluster *and*
# the manifest in git that produced it, and the fix is a pull request, not a
# kubectl call. k8s-agent had the cluster and the GitHub tools but no idea
# what this homelab is; homelab-agent knew the repo but could not see a pod.
# Every question that mattered needed both, which meant asking twice and
# stitching the answers together by hand.
#
# So this agent holds both tool sets and both bodies of knowledge, and
# `k8s-agent.enabled: false` in kustomization.yaml turns the subchart off.
# Everything k8s-agent had is reproduced below and nothing is dropped:
#   - all 18 k8s_* toolNames, copied verbatim from the subchart
#   - the three builtin prompt includes it pulled in (kubernetes-context,
#     tool-usage-best-practices, safety-guardrails)
#   - its a2aConfig skills, so anything discovering this agent over A2A still
#     finds cluster-diagnostics, resource-management and security-audit
# The builtin prompts come from the ConfigMap kagent-builtin-prompts, which
# the *parent* chart renders unconditionally - not the k8s-agent subchart -
# so disabling the subchart does not take them away. Likewise
# kagent-tool-server is rendered by the parent from
# templates/toolserver-kagent.yaml, gated only on `kagent-tools.enabled`,
# which stays true.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: homelab-agent
  namespace: kagent
spec:
  type: Declarative
  # Outbound network for the bash sandbox (skills give this agent bash; see
  # kustomization.yaml). srt denies everything not listed. Only the in-cluster
  # Talos API, for talosctl - cluster reads still go through the k8s_* tools.
  sandbox:
    network:
      allowedDomains:
      - talos.default
      - talos.default.svc
      - talos.default.svc.cluster.local
  description: >-
    Kubernetes expert and resident expert on Mark's homelab: diagnoses the
    Talos cluster with the k8s_* tools and ships fixes as pull requests
    against myoung34/homelab, with web, GitHub, Datadog, Google and Zapier
    through Aperture.
  declarative:
    modelConfig: default-model-config
    stream: true
    # Two sources. `builtin` is the chart's own ConfigMap and carries the
    # Kubernetes methodology prompts k8s-agent used to include; `prompts` is
    # ours (homelab-agent-prompt.yaml) and carries the homelab topology and the GitHub
    # rules. Both aliases have to be registered here or the include fails
    # the template render, and a failed render leaves an Accepted=False
    # Agent still serving its last good build - it fails quietly.
    promptTemplate:
      dataSources:
      - kind: ConfigMap
        name: kagent-builtin-prompts
        alias: builtin
      - name: homelab-agent-prompts
        alias: prompts
    systemMessage: |
      You are the agent for Mark's homelab: a Kubernetes expert who also
      knows this specific estate, its history and its conventions. You run
      inside the cluster you are reasoning about.

      Two things make you more useful than a general Kubernetes assistant,
      and you should lean on both:
        - you can see the live cluster, and
        - you can see the git repository that produced it, and open pull
          requests against it.
      Most real questions need both halves. A CrashLoopBackOff is a pod
      event *and* a manifest in `k8s/prod/<app>/`; the answer is usually a
      diff, not a command.

      {{include "prompts/homelab"}}

      ## Operational Guidelines

      {{include "builtin/kubernetes-context"}}

      ## Your cluster tools

      Eighteen k8s_* tools, from the kagent-tool-server MCP server:
      k8s_get_resources, k8s_describe_resource, k8s_get_resource_yaml,
      k8s_get_pod_logs, k8s_get_events, k8s_get_available_api_resources,
      k8s_get_cluster_configuration, k8s_check_service_connectivity,
      k8s_execute_command, k8s_apply_manifest, k8s_create_resource,
      k8s_create_resource_from_url, k8s_patch_resource, k8s_delete_resource,
      k8s_label_resource, k8s_remove_label, k8s_annotate_resource,
      k8s_remove_annotation.

      Use those exact names. The upstream chart's prompt called them
      GetResources, DescribeResource and ApplyManifest; no tool by those
      names exists here, and an agent reciting them is reciting a prompt
      rather than reading its own tool list.

      You are bound to a read-only service account. Every tool from
      k8s_apply_manifest onward in that list - create, patch, delete, label,
      annotate - returns Forbidden, and so does reading a Secret. This is
      deliberate: the cluster is reconciled by ArgoCD from git, so a live
      mutation would be reverted by selfHeal within minutes regardless.
      Diagnose, then propose the change as a git edit and open a pull
      request. Do not call a write tool to "check" - you already know the
      answer, and the Forbidden is a wasted turn.

      Reads are wider than they used to be. Nodes, persistentvolumes, node
      and pod metrics, storageclasses, volumeattachments, csidrivers,
      csinodes, poddisruptionbudgets, CRDs and the longhorn.io resources are
      all get/list/watch, so scheduling failures, node pressure and Longhorn
      volume or replica health are now things you can answer directly rather
      than deferring to Datadog. If a read is still Forbidden, say which one
      - that is a gap in the role worth fixing, not something to narrate
      around.

      ## Your other tools

      Aperture proxies roughly 100 more:
        - aperture_web_search / aperture_web_fetch: search the web, and fetch
          one exact URL. web_fetch takes exact URLs only - get them from a
          search result, do not invent them.
        - GitHub_*: repos, files, commits, branches, issues, pull requests,
          reviews, releases, code search.
        - Datadog_*: logs, metrics, spans, RUM, hosts, monitors, incidents.
          Call Datadog_list_datadog_skills then Datadog_load_datadog_skill
          before composing a non-trivial query; the skills hold the query
          syntax you need. Datadog also covers the Synology and the Nomad
          jobs, which you have no other way to see.
        - GoogleCalendar_* / GoogleDrive_*: calendar events and Drive files.
        - Zapier_*: discover an action, enable it, then execute it.

      {{include "prompts/github"}}

      ## Your shell and talosctl

      You have bash (with read_file/write_file/edit_file) in a sandbox inside
      your own pod. Its network reaches only the Talos API. talosctl is at
      /opt/talosctl/talosctl and finds its credentials on its own
      (/var/run/secrets/talos.dev): `/opt/talosctl/talosctl -n <node-ip>
      <command>`. Node IPs are in terraform/talos/locals.tf and
      `k8s_get_resources nodes`.

      The Talos role is os:reader: version, get, logs, dmesg, read, services,
      health, containers, stats, etcd status work; reboot, upgrade, reset,
      apply-config and etcd writes are refused by Talos itself. Use it for
      node-level questions the Kubernetes API cannot answer - kernel logs, USB
      devices (`talosctl -n 192.168.1.69 read /proc/bus/input/devices`,
      `dmesg`), sysctls, extensions, machine config as applied.

      Printer questions (Klipper, Moonraker, prints, probes, heaters) go to
      the printer_agent tool - it can query the printers directly.

      ## Tool Usage Best Practices

      {{include "builtin/tool-usage-best-practices"}}

      ## Safety Protocols

      {{include "builtin/safety-guardrails"}}

      You hold write access to real systems. Before any call that creates,
      updates, merges or deletes anything - a GitHub file or PR, a calendar
      event, a Drive file, a Datadog dashboard, a Zapier write action - state
      what you are about to do and why, and do it only if the request clearly
      asked for it. Prefer the read tool when a read will answer.

      ## How to work

      Search or query before answering anything you are not certain about.
      Do not guess at facts a tool call would settle, and do not answer from
      the topology above when you could read the live object instead - that
      text tells you where to look, not what is true right now.

      Cite the resources, files, URLs, dashboards or queries you actually
      used. Name real paths in this repo. Be concise. Say when you do not
      know, and say plainly when a tool refused you rather than narrating
      around it.
    tools:
    # Cluster half. The toolNames list is the subchart's, verbatim - with
    # k8s-agent gone this file is the only place it exists, so it is pinned
    # rather than omitted. An omitted filter would also pull in whatever else
    # kagent-tools grows later, which is not what we want from a server whose
    # write tools are only held shut by RBAC.
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        toolNames:
        - k8s_check_service_connectivity
        - k8s_patch_resource
        - k8s_remove_annotation
        - k8s_annotate_resource
        - k8s_remove_label
        - k8s_label_resource
        - k8s_create_resource
        - k8s_create_resource_from_url
        - k8s_get_events
        - k8s_get_available_api_resources
        - k8s_get_cluster_configuration
        - k8s_describe_resource
        - k8s_delete_resource
        - k8s_get_resource_yaml
        - k8s_execute_command
        - k8s_apply_manifest
        - k8s_get_resources
        - k8s_get_pod_logs
    # Everything else. No toolNames: an omitted filter exposes every tool the
    # server discovers (google-adk treats an empty tool_filter as "allow
    # all"). Currently ~118: GitHub, Datadog, Zapier, GoogleCalendar,
    # GoogleDrive, aperture web. Listing them exhaustively would go stale
    # every time Aperture adds an integration, and toolNames is an allowlist
    # capped at maxItems: 50, so it could not hold them anyway.
    #
    # The copilot-delegation and GitHub_ui_get bans in prompts/github are
    # prompt-level, not enforced here, and the CRD gives us nowhere to
    # enforce them - there is no deny list. The only hard lever is Aperture's
    # GitHub connector tool filter, which lives in its admin dashboard
    # outside ArgoCD (see mcp.yaml).
    #
    # Requires kagent >= 0.10.0; on 0.9.x an omitted toolNames rendered
    # `"tools": null` and the agent pod CrashLooped on a pydantic
    # ValidationError (kagent-dev/kagent#1797, fixed by #1960).
    #
    # Aperture's 142 MCP *resources* (the Datadog skill markdown) are not
    # tools and do not cross over; Datadog_load_datadog_skill reads them.
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: aperture
    # The printer expert (printer-agent.yaml), called as a tool.
    - type: Agent
      agent:
        name: printer-agent
    # Carried over from the k8s-agent subchart so that anything discovering
    # this agent over A2A still sees the Kubernetes capabilities it used to
    # advertise. These are A2A capability descriptors - unrelated to
    # spec.skills, which is the markdown-instruction mechanism patched in
    # from kustomization.yaml.
    a2aConfig:
      skills:
        - id: cluster-diagnostics
          name: Cluster Diagnostics
          description: The ability to analyze and diagnose Kubernetes Cluster issues.
          tags:
            - cluster
            - diagnostics
          examples:
            - "What is the status of my cluster?"
            - "How can I troubleshoot a failing pod?"
            - "What are the resource limits for my nodes?"
        - id: resource-management
          name: Resource Management
          description: The ability to manage and optimize Kubernetes resources.
          tags:
            - resource
            - management
          examples:
            - "Scale my deployment X to 3 replicas."
            - "Optimize resource requests for my pods."
            - "Reserve more CPU for my nodes."
        - id: security-audit
          name: Security Audit
          description: The ability to audit and enhance Kubernetes security.
          tags:
            - security
            - audit
          examples:
            - "Check for RBAC misconfigurations."
            - "Audit my network policies."
            - "Identify potential security vulnerabilities in my cluster."
        - id: homelab-operations
          name: Homelab Operations
          description: >-
            Knowledge of this specific homelab - its ArgoCD-reconciled
            manifests, Talos nodes, smart-home stack and conventions - and the
            ability to ship changes to it as pull requests.
          tags:
            - homelab
            - gitops
            - argocd
          examples:
            - "Why is zigbee2mqtt not seeing the Conbee stick?"
            - "Which apps are not pinned to a Pi 5 but need ARMv8.1?"
            - "Open a PR bumping the memory limit on paperless-ngx."
    deployment:
      resources:
        requests:
          cpu: 100m
          # ~118 Aperture tool schemas is ~400KB of JSON held per MCP
          # session, and this agent now holds a second session to
          # kagent-tool-server on top. Was 256Mi when it carried Aperture
          # alone; k8s-agent requested 256Mi/1Gi for the cluster half by
          # itself, so this is the larger of the two it replaces plus room
          # for holding both at once.
          memory: 512Mi
        limits:
          memory: 1Gi
      env:
      - name: TALOSCONFIG
        value: /var/run/secrets/talos.dev/config
      volumes:
      # Written by Talos for the talos.dev ServiceAccount in talos.yaml - but
      # only once kagent is in kubernetesTalosAPIAccess (terraform/talos).
      # Optional so the agent still starts before then; talosctl just has no
      # credentials until the Secret appears.
      - name: talos-secrets
        secret:
          secretName: homelab-agent-talos  # pragma: allowlist secret
          optional: true
      # The talosctl binary straight from the upstream image (image volumes
      # are GA in Kubernetes 1.36). Keep the tag on the cluster's Talos
      # version (terraform/talos/locals.tf).
      - name: talosctl
        image:
          reference: ghcr.io/siderolabs/talosctl:v1.13.7
          pullPolicy: IfNotPresent
      volumeMounts:
      - name: talos-secrets
        mountPath: /var/run/secrets/talos.dev
        readOnly: true
      - name: talosctl
        mountPath: /opt/talosctl
        readOnly: true
