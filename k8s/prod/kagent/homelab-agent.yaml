---
# The one agent. It was two: homelab-agent (this file, Aperture tools only)
# and k8s-agent (from the chart's subchart, cluster tools only, with its
# systemMessage replaced by a patch in kustomization.yaml because the
# chart's own text was wrong for how we run it).
#
# Splitting them cost more than it bought. Neither half could finish a real
# question on its own: diagnosing a workload means reading the cluster *and*
# the manifest in git that produced it, and the fix is a pull request, not a
# kubectl call. k8s-agent had the cluster and the GitHub tools but no idea
# what this homelab is; homelab-agent knew the repo but could not see a pod.
# Every question that mattered needed both, which meant asking twice and
# stitching the answers together by hand.
#
# So this agent holds both tool sets and both bodies of knowledge, and
# `k8s-agent.enabled: false` in kustomization.yaml turns the subchart off.
# Everything k8s-agent had is reproduced below and nothing is dropped:
#   - all 18 k8s_* toolNames, copied verbatim from the subchart
#   - the three builtin prompt includes it pulled in (kubernetes-context,
#     tool-usage-best-practices, safety-guardrails)
#   - its a2aConfig skills, so anything discovering this agent over A2A still
#     finds cluster-diagnostics, resource-management and security-audit
# The builtin prompts come from the ConfigMap kagent-builtin-prompts, which
# the *parent* chart renders unconditionally - not the k8s-agent subchart -
# so disabling the subchart does not take them away. Likewise
# kagent-tool-server is rendered by the parent from
# templates/toolserver-kagent.yaml, gated only on `kagent-tools.enabled`,
# which stays true.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: homelab-agent
  namespace: kagent
spec:
  type: Declarative
  # Outbound network for the bash sandbox (skills give this agent bash; see
  # kustomization.yaml). srt denies everything not listed:
  #   - the Talos API on the control-plane VIP, for talosctl - cluster reads
  #     still go through the k8s_* tools. Not talos.default: gRPC resolves
  #     names locally, which the sandbox cannot do, and apid's certificate
  #     does not cover the ClusterIP.
  #   - raw.githubusercontent.com, so the agent can read the exact bytes of
  #     an existing file in a public repo. GitHub_get_file_contents cannot
  #     (see the EmbeddedResource gotcha in mcp.yaml), which left it unable
  #     to edit any existing file and therefore unable to open most PRs.
  #     Read-only and unauthenticated: no token is in the sandbox, so this
  #     reaches public content only; all writes still go through GitHub_*.
  # Must match the homelab-agent-srt ConfigMap below, which is what srt reads.
  sandbox:
    network:
      allowedDomains:
      - 192.168.1.254
      - raw.githubusercontent.com
  description: >-
    Kubernetes expert and resident expert on Mark's homelab: diagnoses the
    Talos cluster with the k8s_* tools and ships fixes as pull requests
    against myoung34/homelab, with web, GitHub and Datadog through Aperture.
  declarative:
    # Local qwen3-coder-next (modelconfig-qwen.yaml). Fixed cost is ~31k of
    # the 131k context per request: ~21k of Aperture tool schemas, ~3k of
    # k8s_* schemas, ~6.5k of prompts (measured 2026-10-15). Back to
    # default-model-config (Claude) if sessions start running out of room.
    modelConfig: qwen3-coder-next
    stream: true
    # Bounds long chats on qwen's 131k context. After a turn whose prompt
    # reached tokenThreshold, everything but the last eventRetentionSize
    # events is folded into one rolling summary (tail retention; ADK seeds
    # each summary with the previous one, so it never grows). The summary is
    # written by this agent's own model with ADK's default prompt. Needs our
    # runtime build (images/kagent-adk, kagent-pr2791.patch); stock 0.10.3
    # ignores this block, and the Agent's UnsupportedFeatures condition still
    # says so - with our image that message is out of date.
    #
    # Post-invocation only: it runs when a turn ends, so it cannot rescue one
    # long turn. KAGENT_MAX_TOOL_RESULT_CHARS (deployment.env) covers that.
    # 70000 leaves ~60k of headroom for the next turn on top of the ~31k
    # fixed cost (tool schemas + prompts); 24 events is about a dozen tool
    # round trips kept verbatim.
    context:
      compaction:
        tokenThreshold: 70000
        eventRetentionSize: 24
        # The CRD defaults compactionInterval to 5 (minimum 1), which also
        # turns on ADK's sliding window: a qwen-written summary every 5 user
        # turns whatever their size (agent logged compaction_interval=5,
        # overlap_size=2). It can't be set to off, so set it out of reach;
        # tail retention above is the only strategy wanted here.
        compactionInterval: 100000
    # Two sources. `builtin` is the chart's own ConfigMap and carries the
    # Kubernetes methodology prompts k8s-agent used to include; `prompts` is
    # ours (homelab-agent-prompt.yaml) and carries the homelab topology and the GitHub
    # rules. Both aliases have to be registered here or the include fails
    # the template render, and a failed render leaves an Accepted=False
    # Agent still serving its last good build - it fails quietly.
    promptTemplate:
      dataSources:
      - kind: ConfigMap
        name: kagent-builtin-prompts
        alias: builtin
      - name: homelab-agent-prompts
        alias: prompts
    systemMessage: |
      You are the agent for Mark's homelab: a Kubernetes expert who also
      knows this specific estate, its history and its conventions. You run
      inside the cluster you are reasoning about.

      ## Ground rules (these override anything later)

      1. You have no checkout of any repo. Your bash starts in an empty
         scratch directory; there is no `terraform/` or `k8s/` on disk and
         `find /` will not turn one up. Read every repo file with curl:
           curl -fsSL -o <name> https://raw.githubusercontent.com/myoung34/homelab/<ref>/<path>
         Never tell Mark you "can't access the files". If curl returns 404,
         check the path with GitHub_get_file_contents (directory listing),
         then report exactly what failed.
      2. Never merge a pull request, and never say you are about to. ArgoCD
         deploys whatever lands on main, so a merge is a deploy and it is
         Mark's call. Your job ends at an open PR.
      3. Every fact you put in a PR body, comment or answer about a version,
         upgrade or default needs a source you read in this session: the
         release notes (fetch the GitHub release page), the upstream source,
         or a file in this repo. Do not repeat claims from an existing PR
         body - verify them. If you could not verify something, say so.
      4. Upstream notes describe the general case. Check each one against
         how this repo actually works before relying on it (see "Talos
         and terraform" in the specifics below).

      Two things make you more useful than a general Kubernetes assistant,
      and you should lean on both:
        - you can see the live cluster, and
        - you can see the git repository that produced it, and open pull
          requests against it.
      Most real questions need both halves. A CrashLoopBackOff is a pod
      event *and* a manifest in `k8s/prod/<app>/`; the answer is usually a
      diff, not a command.

      {{include "prompts/homelab"}}

      ## Operational Guidelines

      {{include "builtin/kubernetes-context"}}

      ## Your cluster tools

      Eighteen k8s_* tools, from the kagent-tool-server MCP server:
      k8s_get_resources, k8s_describe_resource, k8s_get_resource_yaml,
      k8s_get_pod_logs, k8s_get_events, k8s_get_available_api_resources,
      k8s_get_cluster_configuration, k8s_check_service_connectivity,
      k8s_execute_command, k8s_apply_manifest, k8s_create_resource,
      k8s_create_resource_from_url, k8s_patch_resource, k8s_delete_resource,
      k8s_label_resource, k8s_remove_label, k8s_annotate_resource,
      k8s_remove_annotation.

      Use those exact names. The upstream chart's prompt called them
      GetResources, DescribeResource and ApplyManifest; no tool by those
      names exists here, and an agent reciting them is reciting a prompt
      rather than reading its own tool list.

      You are bound to a read-only service account. Every tool from
      k8s_apply_manifest onward in that list - create, patch, delete, label,
      annotate - returns Forbidden, and so does reading a Secret. This is
      deliberate: the cluster is reconciled by ArgoCD from git, so a live
      mutation would be reverted by selfHeal within minutes regardless.
      Diagnose, then propose the change as a git edit and open a pull
      request. Do not call a write tool to "check" - you already know the
      answer, and the Forbidden is a wasted turn.

      Reads are wider than they used to be. Nodes, persistentvolumes, node
      and pod metrics, storageclasses, volumeattachments, csidrivers,
      csinodes, poddisruptionbudgets, CRDs and the longhorn.io resources are
      all get/list/watch, so scheduling failures, node pressure and Longhorn
      volume or replica health are now things you can answer directly rather
      than deferring to Datadog. If a read is still Forbidden, say which one
      - that is a gap in the role worth fixing, not something to narrate
      around.

      ## Your other tools

      Aperture proxies 24 more:
        - aperture_web_search / aperture_web_fetch: search the web, and fetch
          one exact URL. web_fetch takes exact URLs only - get them from a
          search result, do not invent them.
        - GitHub_*: files, commits, branches, code search, and pull
          requests (create, update, read, comment, request a Copilot
          review). No issue, release or merge tools.
        - Datadog_*: logs and metrics only. Before a non-trivial query,
          call Datadog_load_datadog_skill with `datadog/logs` or
          `datadog/metrics`; the skill holds the query syntax you need.
          Datadog also covers the Synology and the Nomad jobs, which you
          have no other way to see.

      {{include "prompts/github"}}

      ## Your shell and talosctl

      You have bash (with read_file/write_file/edit_file) in a sandbox inside
      your own pod. Its network reaches only the Talos API on the
      control-plane VIP and raw.githubusercontent.com (how you read files
      in git; see the GitHub section). Run talosctl exactly like this:

        unset NO_PROXY no_proxy
        /opt/talosctl/talosctl -e 192.168.1.254 -n <node-ip> <command>

      The sandbox only has network through srt's proxy, and srt's default
      NO_PROXY sends 192.168.x.x around it; `-e 192.168.1.254` avoids the
      talos.default name in the generated talosconfig, which the sandbox cannot
      resolve. Credentials are picked up from /var/run/secrets/talos.dev.
      Node IPs are in terraform/talos/locals.tf and `k8s_get_resources nodes`.

      The Talos role is os:reader. Verified working: version, services,
      dmesg, logs <service>, get <resource> (members, extensions, ...),
      containers, ls. Refused: read (file contents) and anything that changes
      a node (reboot, upgrade, reset, apply-config). `etcd status` only works
      with -n pointing at a control-plane node. Use it for node-level questions
      the Kubernetes API cannot answer: kernel logs, USB devices (dmesg),
      service health, extensions, the applied machine config resources.

      Printer questions (Klipper, Moonraker, prints, probes, heaters) go to
      the printer_agent tool - it can query the printers directly.

      ## Tool Usage Best Practices

      {{include "builtin/tool-usage-best-practices"}}

      ## Safety Protocols

      {{include "builtin/safety-guardrails"}}

      You hold write access to real systems. Before any call that creates,
      updates or deletes anything - a GitHub file, branch, PR or comment -
      state
      what you are about to do and why, and do it only if the request clearly
      asked for it. Prefer the read tool when a read will answer.

      ## How to work

      Search or query before answering anything you are not certain about.
      Do not guess at facts a tool call would settle, and do not answer from
      the topology above when you could read the live object instead - that
      text tells you where to look, not what is true right now.

      Cite the resources, files, URLs, dashboards or queries you actually
      used. Name real paths in this repo. Be concise. Say when you do not
      know, and say plainly when a tool refused you rather than narrating
      around it.
    tools:
    # Cluster half. The toolNames list is the subchart's, verbatim - with
    # k8s-agent gone this file is the only place it exists, so it is pinned
    # rather than omitted. An omitted filter would also pull in whatever else
    # kagent-tools grows later, which is not what we want from a server whose
    # write tools are only held shut by RBAC.
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        toolNames:
        - k8s_check_service_connectivity
        - k8s_patch_resource
        - k8s_remove_annotation
        - k8s_annotate_resource
        - k8s_remove_label
        - k8s_label_resource
        - k8s_create_resource
        - k8s_create_resource_from_url
        - k8s_get_events
        - k8s_get_available_api_resources
        - k8s_get_cluster_configuration
        - k8s_describe_resource
        - k8s_delete_resource
        - k8s_get_resource_yaml
        - k8s_execute_command
        - k8s_apply_manifest
        - k8s_get_resources
        - k8s_get_pod_logs
    # Aperture, allowlisted to the tools this agent actually uses.
    #
    # This used to omit toolNames, which exposes everything Aperture serves
    # (google-adk treats an empty tool_filter as "allow all"): 143 tools,
    # ~82k tokens of schemas on every request. With the prompts that left
    # qwen's 128k context almost no room, so sessions hit the limit within a
    # few turns and Ollama truncated the prompt every turn (each truncation
    # is a full ~130s re-read). Trimmed 2026-10-13 to 56 tools / ~23k tokens.
    #
    # Dropped entirely: Zapier_* (17 tools, ~10k tokens), GoogleCalendar_*
    # (9, ~9k), GoogleDrive_* (8, ~4.5k). Dropped from Datadog_* (34 -> 9,
    # ~41k -> ~10k): notebooks, dashboards, spans/RUM/traces, incidents,
    # execute_code, entities, sdk search, feedback. Dropped from GitHub_*
    # (45 -> 17): issues, sub-issues, releases/tags, teams, collaborators,
    # repo create/fork, file delete, merge, reviews, secret scanning, search
    # beyond code/PRs. Dropped 2026-10-15: aperture_list_sessions,
    # aperture_get_session and aperture_get_session_request (Aperture's own
    # session browser; unused by any prompt, ~1.4k tokens of schema). Also
    # 2026-10-15, Datadog down to logs and metrics (9 -> 5): dropped
    # search_datadog_monitors, search_datadog_events, search_datadog_hosts
    # and list_datadog_skills (the prompt names the two skills it needs,
    # datadog/logs and datadog/metrics). ~9.4k chars, ~2.4k tokens.
    #
    # To undo: delete the toolNames list below (back to "allow all"; also
    # restore the Google/Zapier lines in "Your other tools" in the system
    # message), or add individual names back. toolNames is capped at
    # maxItems: 50, so "all" can only be had by omitting it. Live names:
    # Aperture MCP tools/list, or the `tools` array of any request capture
    # at https://ai.king-gila.ts.net/api/sessions/<id>/captures.
    #
    # The copilot-delegation and GitHub_ui_get bans in prompts/github are
    # prompt-level; Aperture's GitHub connector tool filter (admin
    # dashboard, outside ArgoCD, see mcp.yaml) is the only other lever.
    #
    # Aperture's 142 MCP *resources* (the Datadog skill markdown) are not
    # tools and do not cross over; Datadog_load_datadog_skill reads them.
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: aperture
        toolNames:
          - aperture_web_search
          - aperture_web_fetch
          - Datadog_load_datadog_skill
          - Datadog_search_datadog_logs
          - Datadog_analyze_datadog_logs
          - Datadog_get_datadog_metric
          - Datadog_search_datadog_metrics
          - GitHub_get_me
          - GitHub_get_file_contents
          - GitHub_create_or_update_file
          - GitHub_push_files
          - GitHub_create_branch
          - GitHub_list_branches
          - GitHub_get_commit
          - GitHub_list_commits
          - GitHub_search_code
          - GitHub_create_pull_request
          - GitHub_update_pull_request
          - GitHub_pull_request_read
          - GitHub_list_pull_requests
          - GitHub_search_pull_requests
          - GitHub_add_issue_comment
          - GitHub_add_reply_to_pull_request_comment
          - GitHub_request_copilot_review
    # The printer expert (printer-agent.yaml), called as a tool.
    - type: Agent
      agent:
        name: printer-agent
    # Carried over from the k8s-agent subchart so that anything discovering
    # this agent over A2A still sees the Kubernetes capabilities it used to
    # advertise. These are A2A capability descriptors - unrelated to
    # spec.skills, which is the markdown-instruction mechanism patched in
    # from kustomization.yaml.
    a2aConfig:
      skills:
        - id: cluster-diagnostics
          name: Cluster Diagnostics
          description: The ability to analyze and diagnose Kubernetes Cluster issues.
          tags:
            - cluster
            - diagnostics
          examples:
            - "What is the status of my cluster?"
            - "How can I troubleshoot a failing pod?"
            - "What are the resource limits for my nodes?"
        - id: resource-management
          name: Resource Management
          description: The ability to manage and optimize Kubernetes resources.
          tags:
            - resource
            - management
          examples:
            - "Scale my deployment X to 3 replicas."
            - "Optimize resource requests for my pods."
            - "Reserve more CPU for my nodes."
        - id: security-audit
          name: Security Audit
          description: The ability to audit and enhance Kubernetes security.
          tags:
            - security
            - audit
          examples:
            - "Check for RBAC misconfigurations."
            - "Audit my network policies."
            - "Identify potential security vulnerabilities in my cluster."
        - id: homelab-operations
          name: Homelab Operations
          description: >-
            Knowledge of this specific homelab - its ArgoCD-reconciled
            manifests, Talos nodes, smart-home stack and conventions - and the
            ability to ship changes to it as pull requests.
          tags:
            - homelab
            - gitops
            - argocd
          examples:
            - "Why is zigbee2mqtt not seeing the Conbee stick?"
            - "Which apps are not pinned to a Pi 5 but need ARMv8.1?"
            - "Open a PR bumping the memory limit on paperless-ngx."
    deployment:
      resources:
        requests:
          cpu: 100m
          # ~118 Aperture tool schemas is ~400KB of JSON held per MCP
          # session, and this agent now holds a second session to
          # kagent-tool-server on top. Was 256Mi when it carried Aperture
          # alone; k8s-agent requested 256Mi/1Gi for the cluster half by
          # itself, so this is the larger of the two it replaces plus room
          # for holding both at once.
          memory: 512Mi
        limits:
          memory: 1Gi
      env:
      - name: TALOSCONFIG
        value: /var/run/secrets/talos.dev/config
      # Truncate any single tool result over 40k characters (~10k tokens)
      # and tell the model to narrow the call. Read by our runtime build
      # (images/kagent-adk, kagent-tool-result-cap.patch); stock kagent
      # ignores it. One unfiltered PR search returned 327k characters and
      # pushed a qwen session past its 131k context. The largest legitimate
      # result in that session was a 39k-character docs fetch.
      - name: KAGENT_MAX_TOOL_RESULT_CHARS
        value: "40000"
      # /opt/srt-shim first so kagent's `srt` resolves to the shim in the
      # homelab-agent-srt ConfigMap below. The rest is the image's own PATH.
      - name: PATH
        value: /opt/srt-shim:/usr/bin:/opt/sandbox-runtime/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/sbin:/bin
      volumes:
      # Written by Talos for the talos.dev ServiceAccount in talos.yaml - but
      # only once kagent is in kubernetesTalosAPIAccess (terraform/talos).
      # Optional so the agent still starts before then; talosctl just has no
      # credentials until the Secret appears.
      - name: talos-secrets
        secret:
          secretName: homelab-agent-talos  # pragma: allowlist secret
          optional: true
      # The talosctl binary straight from the upstream image (image volumes
      # are GA in Kubernetes 1.36). Keep the tag on the cluster's Talos
      # version (terraform/talos/locals.tf).
      - name: talosctl
        image:
          reference: ghcr.io/siderolabs/talosctl:v1.13.7
          pullPolicy: IfNotPresent
      # srt shim and settings; see the homelab-agent-srt ConfigMap below.
      - name: srt-shim
        configMap:
          name: homelab-agent-srt
          defaultMode: 0555
      volumeMounts:
      - name: talos-secrets
        mountPath: /var/run/secrets/talos.dev
        readOnly: true
      - name: talosctl
        mountPath: /opt/talosctl
        readOnly: true
      - name: srt-shim
        mountPath: /opt/srt-shim
        readOnly: true
---
# srt (the bash sandbox) settings for homelab-agent, plus an `srt` shim that
# makes srt use them instead of the file kagent generates.
#
# How: kagent always runs `srt --settings $KAGENT_SRT_SETTINGS_PATH ...` and
# sets that env var itself, after any of ours, so it cannot be overridden.
# Mounting over /config/srt-settings.json with subPath does not work either:
# /config is kagent's Secret volume, where the file is an atomic-writer
# symlink, and runc refuses to bind-mount onto it ("not a directory"), so the
# container never starts. Instead this ConfigMap is mounted at /opt/srt-shim,
# which the Agent puts first on PATH; the shim drops kagent's --settings and
# execs the real srt with this file.
#
# Why override: kagent's generated file only carries network/filesystem, and
# bwrap's fresh /proc mount fails in a container ("Can't mount proc on
# /proc") because the runtime masks paths under the container's /proc and
# the kernel refuses a new procfs over masked ones. procMount: Unmasked would
# fix that but needs hostUsers: false, which kagent 0.10.3 cannot set.
# enableWeakerNestedSandbox makes srt skip that mount; the sandbox then sees
# the container's own /proc (same uid 1001 processes). Network and
# filesystem policy are unchanged.
#
# allowedDomains here is what srt enforces; keep spec.sandbox.network on the
# Agent identical so the two never disagree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-agent-srt
  namespace: kagent
data:
  # kagent calls `srt --settings <its file> <command...>`; drop its
  # --settings and use the file next to this script.
  srt: |
    #!/bin/sh
    if [ "$1" = "--settings" ]; then shift 2; fi
    exec /usr/bin/srt --settings /opt/srt-shim/srt-settings.json "$@"
  srt-settings.json: |
    {
      "enableWeakerNestedSandbox": true,
      "network": {
        "allowedDomains": [
          "192.168.1.254",
          "raw.githubusercontent.com"
        ],
        "deniedDomains": []
      },
      "filesystem": {
        "denyRead": [],
        "allowWrite": [
          ".",
          "/tmp"
        ],
        "denyWrite": []
      }
    }
