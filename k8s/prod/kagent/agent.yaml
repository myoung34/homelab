---
# Minimal agent: talks to Aperture for both halves of the loop - the model is
# served by Aperture's OpenAI-compatible /v1/chat/completions (see
# default-model-config, generated by the helm chart in kustomization.yaml) and
# the tools come from Aperture's MCP endpoint (see mcp.yaml).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: aperture-agent
  namespace: kagent
spec:
  type: Declarative
  description: "Answers questions using Aperture's web search and fetch tools"
  declarative:
    modelConfig: default-model-config
    stream: true
    systemMessage: |
      You are a research assistant running in Mark's homelab Kubernetes cluster.

      You have two tools, both proxied through Tailscale Aperture:
        - aperture_web_search: search the web, returns the top 10 results
        - aperture_web_fetch: fetch the contents of one exact URL

      How to work:
        - Search before you answer anything you are not certain about. Do not
          guess at facts that a search would settle.
        - aperture_web_fetch only accepts exact URLs. Get URLs from a search
          result, do not invent them.
        - Fetch the pages that matter rather than answering from search
          snippets alone.
        - Cite the URLs you actually used.
        - Be concise. Say when you do not know.
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: aperture
        toolNames:
        - aperture_web_search
        - aperture_web_fetch
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
