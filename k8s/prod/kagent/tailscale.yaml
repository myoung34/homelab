apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent
  namespace: kagent
spec:
  defaultBackend:
    service:
      name: kagent-ui
      port:
        number: 8080
  ingressClassName: tailscale
  tls:
  - hosts:
    - kagent
---
# Cluster -> Aperture, without a tailscale egress proxy.
#
# Every node runs the tailscale Talos extension and is itself a tailnet
# device, and it SNATs pod traffic onto the mesh - so a pod can already open a
# connection straight to Aperture's tailnet address. Connectivity was never
# the problem. The only thing missing is name resolution: CoreDNS has no view
# of MagicDNS, so ai.king-gila.ts.net returns NXDOMAIN inside the cluster.
#
# A selectorless Service plus a hand-written EndpointSlice supplies exactly
# that missing piece. kube-proxy DNATs the ClusterIP to the tailnet address,
# so callers keep using http://aperture.kagent.svc.cluster.local and nothing
# in ModelConfig or RemoteMCPServer has to know a tailnet IP.
#
# The alternative - tailscale.com/tailnet-fqdn on an ExternalName Service -
# makes the operator run a proxy pod that joins the tailnet as its own device
# (kagent-aperture). That device mirrors Aperture's entire HTTP surface under
# its own MagicDNS name to anyone whose acls let them reach it, and argocd
# then fights the operator over the externalName it rewrites. Not worth it for
# a DNS lookup we can satisfy here.
#
# Two consequences worth knowing:
#
#   - Aperture sees the *node's* tailnet identity (tag:k8s), not a dedicated
#     tag. tag:k8s already holds a blanket "dst": ["*:*"] acl, so this grants
#     no new reachability, but per-client attribution in Aperture is coarser
#     than a purpose-made tag would give.
#   - The address below is pinned. Tailscale IPs are stable for the life of a
#     device, but re-enrolling Aperture issues a new one and this silently
#     stops resolving. If that happens, `tailscale status | grep ai` has the
#     current value.
#
# Plain http on port 80 is deliberate, per Tailscale's guidance for Aperture
# clients: the hop is already WireGuard-encrypted, and http sidesteps the
# cert/SNI mismatch you would hit addressing Aperture by a name its cert does
# not cover. Aperture authenticates us by tailnet identity, so no API key is
# involved.
apiVersion: v1
kind: Service
metadata:
  name: aperture
  namespace: kagent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
---
# ai.king-gila.ts.net. The label is what binds this slice to the Service
# above; the port name must match the Service's port name.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: aperture
  namespace: kagent
  labels:
    kubernetes.io/service-name: aperture
addressType: IPv4
ports:
- name: http
  port: 80
  protocol: TCP
endpoints:
- addresses:
  - 100.115.219.105
  conditions:
    ready: true
