apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent

resources:
  - namespace.yaml
  - tailscale.yaml
  - vault.yaml
  - mcp.yaml
  - prompt.yaml
  - agent.yaml

patches:
  # Agent skills: directories of markdown instructions (SKILL.md plus any
  # scripts it references) that the agent loads on demand. kagent runs a
  # skills-init initContainer that clones each entry into /skills/<name>, then
  # advertises every SKILL.md's frontmatter name+description in the
  # description of a `skills` tool. The model calls that tool with a skill
  # name to pull the full instructions into context.
  #
  # Side effects of setting spec.skills on an Agent, both of which are the
  # point but worth knowing:
  #   - the agent pod moves from golang-adk:<ver> to golang-adk:<ver>-full,
  #     which carries the sandbox runtime the skills need.
  #   - the model additionally gets bash/read_file/write_file/edit_file,
  #     scoped to a per-session scratch dir under /tmp/kagent/<session> with
  #     /skills mounted read-only. That is a sandbox inside the agent pod, not
  #     cluster access - the only cluster reach is still the k8s_* tools and
  #     their read-only RBAC (see kagent-tools below).
  #
  # Targeting `kind: Agent` without a name. That used to mean two agents,
  # homelab-agent and the subchart's k8s-agent; with the subchart disabled it
  # matches homelab-agent alone. Left unnamed on purpose, so a second agent
  # added later inherits the skills and the securityContext fix rather than
  # silently going NotReady under PodSecurity baseline.
  #
  # One entry per skill, because kagent discovers skills exactly one directory
  # deep - /skills/<name>/SKILL.md - and a gitRef's `path` becomes that one
  # directory. Pointing at the repo's skills/ parent would nest them a level
  # too far and find nothing (kagent-dev/kagent#1422 asks for a wildcard).
  # Cap is 20 entries, so there is room for four more.
  #
  # Pinned to tags rather than tracking main: this is third-party text that
  # lands directly in the context of an agent holding real tools, and an
  # unpinned ref means a pod restart can silently change its instructions.
  # Renovate bumps them via the customManager in renovate.json.
  #
  # Skipped on purpose: ponytail-gain and ponytail-help (a benchmark
  # scoreboard and a command cheatsheet), using-superpowers and
  # diagnosing-superpowers (they describe the Claude Code plugin layout,
  # ~/.claude/skills and its session logs, neither of which exists here -
  # kagent injects its own skill-discovery prompt), and writing-skills
  # (authoring new skills, not something these agents do).
  - target:
      kind: Agent
    patch: |-
      # Keep the agent container out of `privileged`.
      #
      # Setting spec.skills makes kagent's controller set
      # securityContext.privileged=true on the agent container, so that
      # srt/bubblewrap can build its sandbox out of kernel namespaces
      # (manifest_builder.go buildContainerSecurityContext). Talos enforces
      # PodSecurity `baseline` cluster-wide, which forbids that, so the
      # ReplicaSet cannot create pods at all and the agents go NotReady.
      #
      # An explicit allowPrivilegeEscalation: false suppresses it - the
      # controller skips privileged rather than emit a combination the API
      # server would reject. Exempting the namespace instead would be the
      # wrong trade: these pods run model-driven bash, and it would not even
      # work, because bwrap here is not setuid and the container runs as uid
      # 1001, so its only route is an unprivileged user namespace and
      # privileged does not grant one.
      #
      # What this costs until user.max_user_namespaces is raised in
      # terraform/talos: Talos defaults it to 0, so bwrap cannot unshare and
      # bash/write_file/edit_file fail per call. Skill discovery and the
      # instructions themselves are plain file reads and are unaffected, as
      # are the k8s_* tools, which run in the kagent-tools pod.
      - op: add
        path: /spec/declarative/deployment/securityContext
        value:
          allowPrivilegeEscalation: false
      - op: add
        path: /spec/skills
        value:
          gitRefs:
            # Lazy-senior-dev review pass: cut code rather than add it.
            - url: https://github.com/DietrichGebert/ponytail
              ref: v5.1.0
              path: skills/ponytail
            - url: https://github.com/DietrichGebert/ponytail
              ref: v5.1.0
              path: skills/ponytail-audit
            - url: https://github.com/DietrichGebert/ponytail
              ref: v5.1.0
              path: skills/ponytail-debt
            - url: https://github.com/DietrichGebert/ponytail
              ref: v5.1.0
              path: skills/ponytail-review
            # Workflow discipline: plan, test, debug, verify, review.
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/brainstorming
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/writing-plans
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/executing-plans
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/test-driven-development
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/systematic-debugging
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/verification-before-completion
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/requesting-code-review
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/receiving-code-review
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/finishing-a-development-branch
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/using-git-worktrees
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/subagent-driven-development
            - url: https://github.com/obra/superpowers
              ref: v6.4.2
              path: skills/dispatching-parallel-agents

helmCharts:
- name: kagent-crds
  includeCRDs: true
  namespace: kagent
  releaseName: kagent-crds
  version: 0.10.3
  repo: oci://ghcr.io/kagent-dev/kagent/helm
  valuesInline:
    kmcp:
      enabled: false
    substrate:
      enabled: false
- name: kagent
  includeCRDs: true
  namespace: kagent
  releaseName: kagent
  version: 0.10.3
  repo: oci://ghcr.io/kagent-dev/kagent/helm
  valuesInline:
    # The chart's "default" provider generates the ModelConfig named
    # default-model-config, which agent.yaml references and which the UI hands
    # to anything created through the wizard.
    #
    # Provider is Anthropic rather than OpenAI because claude-opus-5-5 is served
    # on /v1/messages only. kagent's Anthropic provider speaks that natively,
    # and `baseUrl` redirects it at Aperture. Note the missing /v1 - the
    # Anthropic client appends /v1/messages itself, where the OpenAI client
    # expects the /v1 to already be in the base.
    #
    # Aperture authorizes by tailnet identity and ignores the Authorization
    # header, but the client still insists on a non-empty key, hence the
    # placeholder. There is no real credential here and nothing to rotate, so
    # this deliberately does not go through vault like the other apps do.
    #
    # On model ids: `curl -s http://ai.king-gila.ts.net/v1/models` splits three
    # ways on metadata.provider.upstream.
    #   - upstream=anthropic / upstream=openai are our own subscriptions, free
    #     to us. claude-opus-5-5 is one of these.
    #   - upstream=spool (every vendor-prefixed id: anthropic/..., google/...,
    #     deepseek/...) is Aperture-provided and billed. Most answer
    #     402 "payment method required" - anthropic/claude-haiku-4.5 does.
    #     Confusingly anthropic/claude-opus-5 does *not*; it appears to fall
    #     back to the subscription. Prefer the unprefixed id so we aren't
    #     relying on that.
    #   - provider.id=codex carries requires_client_auth=true.
    # Also check supported_endpoints before switching: ids differ on whether
    # they serve /v1/messages, /v1/chat/completions or /v1/responses, and the
    # provider block here has to match.
    providers:
      default: anthropic
      anthropic:
        provider: Anthropic
        model: "claude-opus-5-5"
        apiKeySecretRef: aperture-model-key  # pragma: allowlist secret
        apiKeySecretKey: ANTHROPIC_API_KEY  # pragma: allowlist secret
        apiKey: "unused-aperture-authenticates-by-tailnet-identity"  # pragma: allowlist secret
        config:
          baseUrl: "http://aperture.kagent.svc.cluster.local"
    controller:
      loglevel: "info"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      # The DSN is a secret, so it is mounted as a file and referenced by
      # database.postgres.urlFile rather than passed inline. Injecting it as a
      # duplicate POSTGRES_DATABASE_URL env entry does not work: kubelet would
      # take the last one, but Argo CD's structured merge diff treats env as a
      # list keyed on name and rejects duplicates outright.
      volumes:
        - name: db
          secret:
            secretName: kagent  # pragma: allowlist secret
      volumeMounts:
        - name: db
          mountPath: /etc/kagent/db
          readOnly: true
    ui:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      # The UI image needs ARMv8.1+ instructions that the Pi 4's Cortex-A72
      # does not implement. Next.js reaches that code only while serving a
      # request, so the pod passes its health probe, runs for minutes, then
      # dies with SIGILL the moment someone loads a page - supervisord
      # restarts it and nginx returns 502 from the closed upstream.
      #
      # Select on the node-feature-discovery label rather than a hostname:
      # ATOMICS means ARMv8.1 LSE (CAS/SWP/LDADD). Only the Pi 5 (Cortex-A76)
      # advertises it; every Pi 4 here reports a bare ARMv8.0 baseline and
      # also lacks AES/SHA1/SHA2/PMULL. Expressing the CPU requirement keeps
      # this correct as nodes are added or rebuilt.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/cpu-cpuid.ATOMICS
                    operator: In
                    values: ["true"]
      # OpenShift-only Route, and we front the UI with the tailscale Ingress in
      # tailscale.yaml instead.
      route:
        enabled: false
    database:
      postgres:
        # Use the postgres on bigNASty rather than the chart's bundled one,
        # which is where the other services' databases already live and where
        # the psql backup CronWorkflows already point.
        bundled:
          enabled: false
        # Reads the DSN from the secret mounted at controller.volumeMounts
        # above. The chart hard-fails the render unless url, urlFile or
        # bundled is set, and url would mean committing the password here.
        urlFile: /etc/kagent/db/POSTGRES_DATABASE_URL  # pragma: allowlist secret
        # Idle sessions (and their events/tasks/checkpoints) are hard-deleted
        # after this many days. 0, the default, never cleans up.
        sessionRetentionDays: 30
    # Everything below ships enabled by default. The canned agents that target
    # things we don't run (istio, cilium, argo-rollouts, ...) are off - they
    # cost memory on an 8-node arm64 pi cluster for no benefit.
    kmcp:
      enabled: false
    substrate:
      enabled: false
    grafana-mcp:
      enabled: false
    # This block is the *controller's* RBAC, not the agent's. It binds to the
    # kagent-controller SA, which needs write because it creates the
    # Deployment/Service/ConfigMap behind every Agent resource. Empty
    # namespaces = cluster-scoped, which is what lets agents live anywhere.
    # This is kagent's own machinery and no LLM drives it directly.
    #
    # (rbac.clusterScoped was removed upstream and now hard-fails the render;
    # an empty namespaces list is how you ask for cluster scope.)
    rbac:
      namespaces: []
    # homelab-agent's cluster tools all come from the RemoteMCPServer named
    # kagent-tool-server, which only exists when kagent-tools is enabled. The
    # chart does not enforce that pairing, so disabling tools would leave the
    # agent holding a toolNames list pointing at a server that does not
    # exist. This must stay true - it is now the only source of k8s_* tools,
    # and it is independent of `k8s-agent.enabled` below.
    kagent-tools:
      enabled: true
      # THIS is the RBAC the LLM actually wields - the tool server executes
      # every k8s_* tool call under its own SA. The chart's default is
      # readOnly: false, which binds a ClusterRole of apiGroups "*",
      # resources "*", verbs "*" - literal cluster-admin - to a service whose
      # inputs are model output. readOnly swaps that for a curated get/list/
      # watch role over pods, services, events, logs, apps workloads etc.
      #
      # Consequence to expect: homelab-agent still advertises all 18 tools,
      # including k8s_delete_resource / k8s_apply_manifest / k8s_execute_command,
      # because agent.yaml pins that list verbatim from the subchart it
      # replaced. Those fail with Forbidden at call time and the agent
      # reports the error. Diagnosis works; remediation doesn't - which is
      # the point, since ArgoCD selfHeal would revert a live write anyway.
      # Flip to false to allow writes.
      #
      # allowSecrets stays false - otherwise reads cover Secrets too, and
      # every credential in the cluster becomes model context.
      rbac:
        readOnly: true
        allowSecrets: false
        # The upstream readOnly role covers namespaced resources only, so
        # every cluster-scoped get/list fails - including nodes, which the
        # agent needs to explain scheduling failures and node pressure, and
        # the longhorn.io CRDs, which are the only view of volume/replica
        # health. These stay get/list/watch, so this widens visibility
        # without granting a single write.
        #
        # Rendered inside the readOnly branch of the subchart's
        # clusterrole.yaml, so readOnly: true above still holds.
        additionalRules:
          - apiGroups: [""]
            resources: ["nodes", "persistentvolumes"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["metrics.k8s.io"]
            resources: ["nodes", "pods"]
            verbs: ["get", "list"]
          - apiGroups: ["storage.k8s.io"]
            resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["policy"]
            resources: ["poddisruptionbudgets"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["longhorn.io"]
            resources: ["*"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
            verbs: ["get", "list", "watch"]
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    # Disabled: homelab-agent absorbed it. agent.yaml reproduces all 18 of
    # its k8s_* toolNames, the three builtin prompt includes it used, and its
    # a2aConfig skills, and adds the homelab knowledge and Aperture tools the
    # subchart's agent never had. Running both would mean two pods holding
    # two MCP sessions to answer halves of the same question.
    #
    # Nothing this agent needed disappears with it. kagent-builtin-prompts
    # (templates/builtin-prompts-configmap.yaml) and the kagent-tool-server
    # RemoteMCPServer (templates/toolserver-kagent.yaml) are both rendered by
    # the parent chart - the latter gated on `kagent-tools.enabled` directly
    # above, not on this flag. Keep kagent-tools enabled or homelab-agent
    # loses the cluster half entirely.
    k8s-agent:
      enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    kgateway-agent:
      enabled: false
    istio-agent:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
