# Local Qwen3.8-27B on cluster41's R9700 (k8s/prod/ollama), called
# straight at the in-cluster Ollama Service. The chart-generated
# default-model-config (Claude via Aperture) stays as is: the UI wizard hands
# it out, and switching an agent back is a one-line modelConfig change.
#
# Not through Aperture any more. That path was kagent -> Aperture ->
# https://ollama.king-gila.ts.net (tailscale Ingress) -> Ollama, and it lost
# two homelab-agent turns in two sessions while Ollama itself was fine:
# 01a15ef1 had a stream cut at exactly 3m0s that kagent never saw end, and
# 01a1643c sent a request (2026-10-22 15:45:59) that neither Aperture's
# captures nor Ollama's log ever recorded. Which hop drops them is unknown.
# The cost: qwen usage no longer shows in Aperture. MCP tools still go
# through Aperture (mcp.yaml); only model calls skip it.
#
# OpenAI provider on Ollama's OpenAI-compatible /v1/chat/completions; the
# OpenAI client wants /v1 in baseUrl. Ollama ignores the key, but the client
# insists on one, so this reuses the chart's placeholder Secret (its key
# name is ANTHROPIC_API_KEY; the value is a dummy either way).
#
# Model is the :agent tag, which carries use_mmap=false, num_ctx=131072,
# num_batch=2048 and num_predict=32768. Sampling comes from the model
# (Qwen's thinking-mode recommendation: temperature 1.0, top_p 0.95,
# top_k 20), so none is set here.
#
# Context budget: homelab-agent's tool schemas are ~23k tokens since its
# Aperture tools were allowlisted (homelab-agent.yaml; ~82k before, which
# pinned sessions at the 128k limit) and its prompts ~4k, so ~100k is left
# for the conversation. The first turn reads everything (~30s at
# ~1000 tok/s); later turns reuse llama-server's prompt cache (3-7s per
# turn measured with two agents alternating).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: qwen
  namespace: kagent
spec:
  provider: OpenAI
  model: "qwen3.8:agent"
  apiKeySecret: aperture-model-key  # pragma: allowlist secret
  apiKeySecretKey: ANTHROPIC_API_KEY  # pragma: allowlist secret
  openAI:
    baseUrl: "http://ollama.ollama.svc.cluster.local:11434/v1"
    # Caps one reply, thinking included. Matches the tag's num_predict
    # 32768; at ~38 tok/s that's ~14 min. Agent replies with coder-next
    # were p50 114, p99 2468 tokens; a thinking model writes more.
    maxTokens: 32768
    # Fail a stuck request in 20 min instead of kagent's 30m default
    # (go/adk/pkg/models/base.go defaultTimeout). Covers a full 32768-token
    # reply (~14 min) after reading a full 128k prompt (~3 min at 765 tok/s).
    timeout: 1200
