# printer-agent: the resident expert on the Klipper printers.
#
# A plain declarative Agent, no custom code. It inherits this app's unnamed
# `kind: Agent` patch (kustomization.yaml), so it has skills and therefore
# bash; spec.sandbox below lets that bash reach Moonraker on the printers'
# in-cluster Services (k8s/prod/klipper) and nothing else. klippy.log and
# moonraker.log are shipped to Datadog by sidecars in the klipper Deployments,
# and read here through Aperture's Datadog tools.
#
# homelab-agent can call this agent as a tool (homelab-agent.yaml).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: printer-agent
  namespace: kagent
spec:
  type: Declarative
  description: >-
    Expert on Mark's Klipper 3D printers (enderbig, enderleft, enderright):
    queries Moonraker directly, reads klippy/moonraker logs in Datadog and the
    printer configs, and diagnoses from evidence.
  # Must match the printer-agent-srt ConfigMap below, which is what srt reads.
  sandbox:
    network:
      allowedDomains:
      - "*.klipper.svc.cluster.local"
  declarative:
    modelConfig: default-model-config
    stream: true
    promptTemplate:
      dataSources:
      - name: printer-agent-prompts
        alias: printer
    systemMessage: |
      {{include "printer/printers"}}
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        # Read-only: pod state/logs/events in klipper, and the seed
        # ConfigMaps (k8s_get_resource_yaml).
        toolNames:
        - k8s_get_resources
        - k8s_describe_resource
        - k8s_get_resource_yaml
        - k8s_get_pod_logs
        - k8s_get_events
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: aperture
        toolNames:
        - Datadog_search_datadog_logs
        - Datadog_analyze_datadog_logs
        - Datadog_list_datadog_skills
        - Datadog_load_datadog_skill
        - aperture_web_search
        - aperture_web_fetch
    a2aConfig:
      skills:
        - id: printer-expert
          name: Printer Expert
          description: Diagnoses and explains Mark's Klipper printers from live Moonraker data, logs and config.
          tags: [klipper, moonraker, 3d-printing]
          examples:
            - "Why did my Ender 5 stop during the last print?"
            - "Why does G28 fail intermittently on enderleft?"
            - "Is enderbig ready to print?"
            - "What changed in the config since the last good print?"
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 768Mi
      env:
      # /opt/srt-shim first so kagent's `srt` resolves to the shim in the
      # printer-agent-srt ConfigMap below. The rest is the image's own PATH.
      - name: PATH
        value: /opt/srt-shim:/usr/bin:/opt/sandbox-runtime/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/sbin:/bin
      volumes:
      # srt shim and settings; see the printer-agent-srt ConfigMap below.
      - name: srt-shim
        configMap:
          name: printer-agent-srt
          defaultMode: 0555
      volumeMounts:
      - name: srt-shim
        mountPath: /opt/srt-shim
        readOnly: true
---
# srt (the bash sandbox) settings for printer-agent, plus an `srt` shim that
# makes srt use them instead of the file kagent generates. See the
# homelab-agent-srt ConfigMap in homelab-agent.yaml for why it is a PATH shim
# rather than a mount over /config/srt-settings.json.
#
# Why override: kagent's generated file only carries network/filesystem, and
# bwrap's fresh /proc mount fails in a container ("Can't mount proc on
# /proc") because the runtime masks paths under the container's /proc and
# the kernel refuses a new procfs over masked ones. procMount: Unmasked would
# fix that but needs hostUsers: false, which kagent 0.10.3 cannot set.
# enableWeakerNestedSandbox makes srt skip that mount; the sandbox then sees
# the container's own /proc (same uid 1001 processes). Network and
# filesystem policy are unchanged.
#
# allowedDomains here is what srt enforces; keep spec.sandbox.network on the
# Agent identical so the two never disagree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: printer-agent-srt
  namespace: kagent
data:
  # kagent calls `srt --settings <its file> <command...>`; drop its
  # --settings and use the file next to this script.
  srt: |
    #!/bin/sh
    if [ "$1" = "--settings" ]; then shift 2; fi
    exec /usr/bin/srt --settings /opt/srt-shim/srt-settings.json "$@"
  srt-settings.json: |
    {
      "enableWeakerNestedSandbox": true,
      "network": {
        "allowedDomains": [
          "*.klipper.svc.cluster.local"
        ],
        "deniedDomains": []
      },
      "filesystem": {
        "denyRead": [],
        "allowWrite": [
          ".",
          "/tmp"
        ],
        "denyWrite": []
      }
    }
