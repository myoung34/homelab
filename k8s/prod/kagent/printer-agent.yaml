# printer-agent: the resident expert on the Klipper printers.
#
# A plain declarative Agent, no custom code. It inherits this app's unnamed
# `kind: Agent` patch (kustomization.yaml), so it has skills and therefore
# bash, which reaches Moonraker on the printers' in-cluster Services
# (k8s/prod/klipper). klippy.log and
# moonraker.log are shipped to Datadog by sidecars in the klipper Deployments,
# and read here through Aperture's Datadog tools.
#
# homelab-agent can call this agent as a tool (homelab-agent.yaml).
#
# It also opens its own pull requests for k8s/prod/klipper (Deployments,
# Datadog log annotations, seed configs). Before 2026-10-08 it had no GitHub
# tools, so asked for a PR it could only hand back a pasteable diff
# (session 01a11d49-895c-70fa-9520-2fd8c0ee401c). It now has the GitHub
# tools a PR needs, the shared GitHub rules (prompts/github from
# homelab-agent-prompt.yaml), and raw.githubusercontent.com plus
# codeload.github.com (whole-repo tarballs, which prompts/github tells it to
# start from) for reading file bodies (see mcp.yaml for why
# get_file_contents cannot).
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: printer-agent
  namespace: kagent
spec:
  type: Declarative
  description: >-
    Expert on Mark's Klipper 3D printers (enderbig, enderleft, enderright):
    queries Moonraker directly, reads klippy/moonraker logs in Datadog and the
    printer configs, and diagnoses from evidence.
  declarative:
    # Local Qwen3.8-27B (modelconfig-qwen.yaml).
    modelConfig: qwen
    stream: true
    promptTemplate:
      dataSources:
      - name: printer-agent-prompts
        alias: printer
      - name: homelab-agent-prompts
        alias: prompts
    systemMessage: |
      {{include "printer/printers"}}

      ## GitHub

      {{include "prompts/github"}}
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        # Read-only: pod state/logs/events in klipper, and the seed
        # ConfigMaps (k8s_get_resource_yaml).
        toolNames:
        - k8s_get_resources
        - k8s_describe_resource
        - k8s_get_resource_yaml
        - k8s_get_pod_logs
        - k8s_get_events
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: aperture
        toolNames:
        - Datadog_search_datadog_logs
        - Datadog_analyze_datadog_logs
        - Datadog_list_datadog_skills
        - Datadog_load_datadog_skill
        - aperture_web_search
        - aperture_web_fetch
        # Pull requests against myoung34/homelab (k8s/prod/klipper).
        - GitHub_get_file_contents
        - GitHub_list_commits
        - GitHub_get_commit
        - GitHub_search_code
        - GitHub_create_branch
        - GitHub_push_files
        - GitHub_create_or_update_file
        - GitHub_create_pull_request
        - GitHub_update_pull_request
        - GitHub_list_pull_requests
        - GitHub_pull_request_read
    a2aConfig:
      skills:
        - id: printer-expert
          name: Printer Expert
          description: Diagnoses and explains Mark's Klipper printers from live Moonraker data, logs and config.
          tags: [klipper, moonraker, 3d-printing]
          examples:
            - "Why did my Ender 5 stop during the last print?"
            - "Why does G28 fail intermittently on enderleft?"
            - "Is enderbig ready to print?"
            - "What changed in the config since the last good print?"
    deployment:
      # LLM agent: no CPU limit. It idles near 10m but bursts to 1-2 cores
      # on startup and tool calls, and throttling would slow replies and
      # fail probes. The memory limit stays as a guard against a runaway
      # context; the request tracks measured p95 x1.2 (floor 128Mi).
      resources:
        requests:
          cpu: 50m
          memory: 160Mi
        limits:
          memory: 768Mi
      env:
      # /opt/srt-shim first so kagent's `srt` resolves to the passthrough in
      # bash-shim.yaml. The rest is the image's own PATH.
      - name: PATH
        value: /opt/srt-shim:/usr/bin:/opt/sandbox-runtime/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/sbin:/bin
      # Truncate any single tool result over 40k characters (~10k tokens),
      # same as homelab-agent (see the comment there). This agent also runs
      # on qwen's 131k context, and pod logs (k8s_get_pod_logs on the
      # Klipper pods), Datadog log searches, web fetches and GitHub listings
      # can each return far more than that.
      - name: KAGENT_MAX_TOOL_RESULT_CHARS
        value: "40000"
      volumes:
      # No-sandbox srt; see bash-shim.yaml.
      - name: srt-shim
        configMap:
          name: agent-bash
          defaultMode: 0555
      volumeMounts:
      - name: srt-shim
        mountPath: /opt/srt-shim
        readOnly: true
