# Slack bridge to the kagent agents: @mention the bot in a channel, or DM
# it, and it asks an agent over A2A and replies in the thread. Source and
# tests: github.com/myoung34/kagent-slack-bridge; Renovate bumps the image
# tag. Slack app: slack-app-manifest.yaml there.
#
# The bridge picks the agent itself, by prefix: `printer: ...` goes to
# printer-agent, `general: ...` to general-agent, anything else to
# homelab-agent (first in KAGENT_AGENTS). A thread stays with the agent its
# first message picked. This used to go through router-agent (since
# deleted), whose small model sent a GitHub request to general-agent and
# re-sent it three times (2026-11-17), told Mark "I'll relay the findings"
# instead of relaying homelab-agent's follow-up question (2026-11-18), and
# only ever stood between Mark and an agent that could answer.
#
# Socket Mode, so no ingress: the pod dials out to Slack. One replica - two
# would each hold a socket and Slack would spread events across them, which
# is harmless but buys nothing.
#
# Only Slack user IDs in ALLOWED_USER_IDS (Vault) get an answer; the agents
# open PRs (homelab-agent) and edit the calendar (general-agent).
#
# Each Slack thread is one kagent session (id derived from agent and
# thread), so it also shows in the kagent UI. When an agent stops to ask
# something (ask_user) or wants a tool approved, the bot posts it and the
# next thread reply answers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-slack
  namespace: kagent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-slack
  namespace: kagent
  annotations:
    secret.reloader.stakater.com/reload: kagent-slack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kagent-slack
  template:
    metadata:
      labels:
        app: kagent-slack
    spec:
      serviceAccountName: kagent-slack
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bot
        image: ghcr.io/myoung34/kagent-slack-bridge:0.4.1
        env:
        # First is the default; `<name>:` picks <name>-agent.
        - name: KAGENT_AGENTS
          value: homelab-agent printer-agent general-agent
        - name: KAGENT_A2A_URL
          value: http://kagent-controller.kagent:8083/api/a2a/kagent/{agent}/
        - name: KAGENT_UI_CHAT_URL
          value: https://kagent.king-gila.ts.net/agents/kagent/{agent}/chat
        # SLACK_BOT_TOKEN, SLACK_APP_TOKEN, ALLOWED_USER_IDS
        envFrom:
        - secretRef:
            name: kagent-slack
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # No CPU limit, like the agents: it bursts to ~1.7 cores on startup.
        resources:
          requests:
            cpu: 10m
            memory: 56Mi
          limits:
            memory: 128Mi
