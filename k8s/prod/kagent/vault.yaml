---
# Holds POSTGRES_DATABASE_URL, the full DSN for the kagent database on
# bigNASty. The controller reads it as a file rather than an env var (see
# database.postgres.urlFile in kustomization.yaml), so the password never
# appears in the pod spec, in `kubectl describe`, or in this repo.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kagent
spec:
  vaultAuthRef: kagent
  mount: secret/
  type: kv-v2
  path: kagent
  refreshAfter: 60s
  destination:
    create: true
    name: kagent
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kagent
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kagent
    serviceAccount: default
---
# MinIO key for the agent-memory CronJob (agent-memory.yaml), scoped to the
# agent-memory bucket. Its own ServiceAccount and role, so nothing else in
# kagent can read it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: agent-memory
spec:
  vaultAuthRef: agent-memory
  mount: secret/
  type: kv-v2
  path: agent-memory
  refreshAfter: 60s
  destination:
    create: true
    name: agent-memory
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: agent-memory
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: agent-memory
    serviceAccount: agent-memory
---
# Slack tokens for the kagent-slack bridge (slack-bot.yaml): SLACK_BOT_TOKEN
# (xoxb-), SLACK_APP_TOKEN (xapp-, connections:write) and ALLOWED_USER_IDS
# (comma-separated Slack member IDs). Own ServiceAccount and role, so nothing
# else in kagent can read it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kagent-slack
spec:
  vaultAuthRef: kagent-slack
  mount: secret/
  type: kv-v2
  path: kagent-slack
  refreshAfter: 60s
  destination:
    create: true
    name: kagent-slack
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kagent-slack
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kagent-slack
    serviceAccount: kagent-slack
