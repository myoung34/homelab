# Taints nodes whose IO or CPU is stalled so the descheduler (RemovePodsViolatingNodeTaints)
# moves pods off them. Hysteresis per check in CHECKS: taint above HIGH% stall, untaint
# below LOW%, so pods drift back once the node recovers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: io-pressure-tainter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: io-pressure-tainter
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["nodes/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: io-pressure-tainter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: io-pressure-tainter
subjects:
- kind: ServiceAccount
  name: io-pressure-tainter
  namespace: descheduler
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: io-pressure-tainter
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  # Only start a run within 60s of its slot. Without a deadline the
  # controller counts every missed slot and, past 100, logs
  # TooManyMissedTimes every 2 minutes (317 of them during the cluster41
  # outage, 2026-10-24). Doesn't unblock a run stuck on a dead node.
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 110
      template:
        spec:
          serviceAccountName: io-pressure-tainter
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: tainter
            image: alpine/k8s:1.37.2
            imagePullPolicy: IfNotPresent
            env:
            - {name: HOME, value: /tmp}
            # key:cadvisor-metric:HIGH%:LOW%. io = "full" stall, cpu = "some" wait.
            # cpu HIGH 80: healthy Pis sit 20-50% (cluster13 52%); undervolted,
            # throttled cluster11 hit 97% on 2026-11-26.
            - name: CHECKS
              value: >-
                homelab/io-pressure:container_pressure_io_stalled_seconds_total:50:10
                homelab/cpu-pressure:container_pressure_cpu_waiting_seconds_total:80:40
            - {name: WINDOW, value: "60"}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 70m
                memory: 16Mi
              limits:
                cpu: 650m
                memory: 120Mi
            command: ["bash", "-c"]
            args:
            - |
              set -euo pipefail
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              metrics() { curl -sfk -m 10 -H "Authorization: Bearer $TOKEN" "https://$1:10250/metrics/cadvisor" || true; }
              # cumulative node-level (id="/") seconds for metric $1, from metrics on stdin
              pick() { awk -v m="$1" 'index($0, m "{") == 1 && /id="\/"/ {print $2; exit}'; }
              declare -A ip before
              while read -r n addr _; do
                ip[$n]=$addr
                body=$(metrics "$addr")
                for c in $CHECKS; do
                  IFS=: read -r key metric _ _ <<<"$c"
                  before[$n|$key]=$(pick "$metric" <<<"$body")
                done
              done < <(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name} {.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}')
              sleep "$WINDOW"
              for n in "${!ip[@]}"; do
                body=$(metrics "${ip[$n]}")
                for c in $CHECKS; do
                  IFS=: read -r key metric high low <<<"$c"
                  a=${before[$n|$key]}
                  b=$(pick "$metric" <<<"$body")
                  if [ -z "$a" ] || [ -z "$b" ]; then
                    echo "$n $key: no metrics, leaving as is"
                    continue
                  fi
                  pct=$(awk -v a="$a" -v b="$b" -v w="$WINDOW" 'BEGIN {printf "%d", (b - a) / w * 100}')
                  tainted=$(kubectl get node "$n" -o jsonpath="{.spec.taints[?(@.key==\"$key\")].key}")
                  if [ -z "$tainted" ] && [ "$pct" -ge "$high" ]; then
                    kubectl taint node "$n" "$key=true:NoSchedule"
                  elif [ -n "$tainted" ] && [ "$pct" -lt "$low" ]; then
                    kubectl taint node "$n" "$key:NoSchedule-"
                  fi
                  echo "$n $key: ${pct}%"
                done
              done
