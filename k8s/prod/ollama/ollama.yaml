apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  ports:
  - name: http
    port: 11434
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: true
      # qwen3:4b needs ~2.5-3GB resident for weights; the requests below are
      # a floor so the scheduler avoids nodes that can't actually fit it.
      # No hard node affinity is set - if scheduling still lands somewhere too
      # small, pin this to a specific node via nodeSelector/affinity.
      initContainers:
      - name: pull-model
        image: "ollama/ollama:latest"
        imagePullPolicy: IfNotPresent
        env:
        # Default splits each blob into many concurrent chunk downloads: fine
        # on a solid link, but on a flaky one all of them stall together and
        # the whole pull restarts from 0%. Cutting concurrency trades peak
        # throughput for actually finishing.
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        command:
        - /bin/sh
        - -c
        - |
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull qwen3:4b
          ollama rm qwen3:8b || true
          kill $pid
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
      containers:
      - name: ollama
        image: "ollama/ollama:latest"
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 1000m
            memory: 3Gi
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-data
