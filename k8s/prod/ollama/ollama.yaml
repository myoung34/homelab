apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  ports:
  - name: http
    port: 11434
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: true
      # Serves qwen3-coder-next (80B MoE, ~3B active) for async coding
      # agents, as unsloth's UD-IQ3_XXS GGUF (28.5GB). At 128k context and
      # num_batch 2048 it fits entirely in the 32GB card. Clients should use
      # the tuned `qwen3-coder-next:agent` tag built by pull-model below.
      #
      # GPU offload (AMD Radeon AI PRO R9700 32GB / gfx1201 via ROCm): requesting
      # amd.com/gpu below requires the siderolabs/amdgpu Talos extension on
      # the node plus the ROCm/k8s-device-plugin DaemonSet running in the
      # cluster - both are set up outside this manifest. The device plugin
      # injects /dev/kfd + /dev/dri itself; no manual hostPath mount needed.
      # The amd.com/gpu request already limits this to GPU nodes; the NFD label
      # (k8s/prod/node-feature-discovery/amd-gpu-nodefeaturerule.yaml) makes
      # that intent explicit without pinning a hostname.
      #
      # cluster41 also has an RTX 2070 SUPER, which serves the small
      # general-purpose model from its own Ollama (general.yaml). This pod only gets the R9700: the ROCm
      # image plus amd.com/gpu never sees /dev/nvidia*.
      nodeSelector:
        feature.node.kubernetes.io/amd-gpu: "true"
      initContainers:
      - name: pull-model
        # Patched Ollama (images/ollama): stock 0.40.3-rocm + ollama/ollama#18433.
        # Stock 0.40.3 rendered kagent's tool list in a different order on
        # every request, so qwen's prompt cache never hit and every agent
        # turn re-read ~128k tokens (~130s). Back to the official image once
        # a release includes the fix; see images/ollama/Dockerfile.
        image: "ghcr.io/myoung34/homelab/ollama:0.40.3-rocm-pr18433"
        imagePullPolicy: IfNotPresent
        env:
        # Default splits each blob into many concurrent chunk downloads: fine
        # on a solid link, but on a flaky one all of them stall together and
        # the whole pull restarts from 0%. Cutting concurrency trades peak
        # throughput for actually finishing.
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # If gfx1201 gets detected but Ollama still falls back to CPU (a
        # known rough edge for RDNA4 as of mid-2026), uncomment and set
        # this to a supported target to force recognition:
        # - name: HSA_OVERRIDE_GFX_VERSION
        #   value: "11.0.0"
        # Builds qwen3-coder-next:agent from unsloth's UD-IQ3_XXS GGUF. The
        # TEMPLATE/RENDERER/PARSER and sampling (Qwen's temperature 1.0,
        # top_p 0.95, top_k 40) are copied from the library model's
        # Modelfile; the qwen3-coder renderer is what images/ollama patches.
        #
        # Quant, measured 2026-10-14 (18k-token prompt tok/s reading /
        # generating; HumanEval+ and MBPP+ pass@1, greedy, evalplus):
        #   Q4_K_M (library) 48.5GB 44% CPU 1190 / 28  HE+ 88.4  MBPP+ 74.6
        #   UD-IQ4_XS        38.4GB 27% CPU 1807 / 33  HE+ 87.8
        #   UD-Q3_K_XL       36.3GB 24% CPU 1920 / 37  HE+ 89.0
        #   UD-IQ3_XXS       28.5GB  0% CPU 2517 / 65  HE+ 88.4  MBPP+ 75.4
        # (IQ3_XXS row at num_batch 2048, the others at 4096.) Every quant
        # scored within noise of Q4_K_M and passed 20/20 tool calls, so the
        # one that fits on the GPU wins: 2.1x prompt reading, 2.3x
        # generation, and ~24GB of node RAM back.
        #
        # use_mmap false - kept from Q4_K_M, where the 51GB model didn't fit
        #   in RAM and mmap'd loads stalled re-reading from Longhorn.
        # num_ctx 131072 - agent sessions run long. KV is cheap on this
        #   arch (only 12 of 48 layers are full attention): 3GB f16 at 128k.
        #   Clients sending a different num_ctx force a reload.
        # num_batch 2048 - sets llama-server -b/-ub. On IQ3_XXS:
        #     1024  2218 / 65  100% GPU
        #     2048  2517 / 65  100% GPU
        #     4096  2304 / 59  2.3GB spilled to CPU by the bigger buffer
        #
        # qwen3:4b was a GPU smoke test with no consumers; it's removed so a
        # stray request can't evict the coder model (MAX_LOADED_MODELS=1).
        # The old library Q4_K_M is removed too (48.5GB of the 100Gi PVC).
        command:
        - /bin/sh
        - -c
        - |
          set -e
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull hf.co/unsloth/Qwen3-Coder-Next-GGUF:UD-IQ3_XXS
          cat > /tmp/Modelfile <<'EOF'
          FROM hf.co/unsloth/Qwen3-Coder-Next-GGUF:UD-IQ3_XXS
          TEMPLATE {{ .Prompt }}
          RENDERER qwen3-coder
          PARSER qwen3-coder
          PARAMETER temperature 1
          PARAMETER top_k 40
          PARAMETER top_p 0.95
          PARAMETER use_mmap false
          PARAMETER num_ctx 131072
          PARAMETER num_batch 2048
          EOF
          ollama create qwen3-coder-next:agent -f /tmp/Modelfile
          # One rm per model: a multi-arg rm stops at the first missing one.
          for m in qwen3:4b qwen3:8b qwen3-coder-next:latest; do
            ollama rm "$m" 2>/dev/null || true
          done
          kill $pid
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
            amd.com/gpu: 1
          limits:
            amd.com/gpu: 1
      containers:
      - name: ollama
        # Same patched image as pull-model above.
        image: "ghcr.io/myoung34/homelab/ollama:0.40.3-rocm-pr18433"
        imagePullPolicy: IfNotPresent
        # Serve, then preload qwen3-coder-next:agent in the background so the
        # ~90-220s load happens at pod start instead of on the first agent
        # request. `ollama run <model> ""` is Ollama's documented preload;
        # with KEEP_ALIVE=-1 it then stays resident. The trap forwards
        # SIGTERM, since sh as PID 1 would otherwise ignore it.
        command:
        - /bin/sh
        - -c
        - |
          ollama serve &
          pid=$!
          trap 'kill -TERM $pid' TERM INT
          (
            until ollama list >/dev/null 2>&1; do sleep 1; done
            ollama run qwen3-coder-next:agent "" >/dev/null 2>&1 || true
          ) &
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # Default (5m) unloads the model between requests, paying a ~90-220s
        # reload on the next one. This node's dedicated to Ollama, so keep
        # the coder model resident.
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        # The coder model needs the whole card plus most of host RAM; a
        # second loaded model could only fit by evicting it.
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        # One request at a time. Each extra slot adds its own context (and
        # Ollama sizes KV per slot), and there's no VRAM/RAM headroom left;
        # concurrent agents queue instead (OLLAMA_MAX_QUEUE, default 512).
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        # Default context for requests that don't set num_ctx (e.g. clients
        # hitting the bare tag); matches the :agent tag so they don't force a
        # reload at a different size.
        - name: OLLAMA_CONTEXT_LENGTH
          value: "131072"
        # Load-stall timeout (default 5m). A cold load reads 28.5GB off the
        # PVC; give a slow disk or busy node headroom rather than failing.
        - name: OLLAMA_LOAD_TIMEOUT
          value: "15m"
        # Cap llama-server's host-RAM prompt state. Ollama has no knob for
        # these, but the llama-server it spawns inherits this env and reads
        # LLAMA_ARG_* for any flag Ollama doesn't pass itself.
        #
        # Defaults are an 8GiB prompt cache plus up to 32 context checkpoints
        # per slot (~75MiB each; qwen3next is hybrid/recurrent, so rolling
        # back needs a saved state). Both live in host RAM, and on Q4_K_M this
        # node had ~3.5GB free once the CPU-side experts loaded. A long session
        # grows them until the kernel OOM-kills Ollama (seen twice on
        # 2026-10-09: a 60k-token prompt took MemAvailable from 3.3GB to 0;
        # the cache logged a 67k-token prompt at 1.8GiB). Every kill costs a
        # 90s+ reload and the in-flight agent turn.
        #
        # 1GiB still holds a printer-agent-sized prompt so switching between
        # agents doesn't always re-read it; homelab-agent's ~64k prompt won't
        # fit and gets re-read (~55s) after another agent has run. 8
        # checkpoints (~600MiB) is plenty for append-only agent turns.
        - name: LLAMA_ARG_CACHE_RAM
          value: "1024"
        - name: LLAMA_ARG_CTX_CHECKPOINTS
          value: "8"
        # Deliberately not set, per testing/research:
        # - OLLAMA_FLASH_ATTENTION: the default (auto) already resolves to
        #   enabled on this card ("Flash Attention enabled" in load logs).
        # - OLLAMA_KV_CACHE_TYPE=q8_0: measured on IQ3_XXS at 128k / batch
        #   2048: saves 1.4GB VRAM, same prompt reading, generation 65 -> 59
        #   tok/s (-10%), HE+ 87.8 vs 88.4 (noise). The model already fits
        #   on the GPU, so the VRAM buys nothing.
        # See the HSA_OVERRIDE_GFX_VERSION note on the pull-model
        # initContainer above if the GPU isn't actually getting used.
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        # The model is all on the GPU: 1.3GiB measured loaded, plus up to
        # ~1.6GiB of prompt cache and checkpoints (LLAMA_ARG_* above).
        # No memory limit: an OOM kill would cost a reload.
        resources:
          requests:
            cpu: 1000m
            memory: 3Gi
            amd.com/gpu: 1
          limits:
            amd.com/gpu: 1
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-data
