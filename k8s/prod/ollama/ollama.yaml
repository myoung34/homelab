apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  ports:
  - name: http
    port: 11434
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: true
      # Serves Qwen3.8-27B for async coding agents. At 128k context it fits
      # entirely in the 32GB card. Clients should use the tuned
      # `qwen3.8:agent` tag built by pull-model below.
      #
      # GPU offload (AMD Radeon AI PRO R9700 32GB / gfx1201 via ROCm): requesting
      # amd.com/gpu below requires the siderolabs/amdgpu Talos extension on
      # the node plus the ROCm/k8s-device-plugin DaemonSet running in the
      # cluster - both are set up outside this manifest. The device plugin
      # injects /dev/kfd + /dev/dri itself; no manual hostPath mount needed.
      # The amd.com/gpu request already limits this to GPU nodes; the NFD label
      # (k8s/prod/node-feature-discovery/amd-gpu-nodefeaturerule.yaml) makes
      # that intent explicit without pinning a hostname.
      #
      # cluster41 also has an RTX 2070 SUPER, which serves the small
      # general-purpose model from its own Ollama (general.yaml). This pod only gets the R9700: the ROCm
      # image plus amd.com/gpu never sees /dev/nvidia*.
      nodeSelector:
        feature.node.kubernetes.io/amd-gpu: "true"
      initContainers:
      - name: pull-model
        # Patched Ollama (images/ollama): stock 0.40.3-rocm + ollama/ollama#18433,
        # plus an OLLAMA_CONTEXT_SHIFT off switch (set on the ollama container).
        # Stock 0.40.3 rendered kagent's tool list in a different order on
        # every request, so qwen's prompt cache never hit and every agent
        # turn re-read ~128k tokens (~130s). Back to the official image once
        # a release includes the fix; see images/ollama/Dockerfile.
        image: "ghcr.io/myoung34/homelab/ollama:0.40.3-rocm-pr18433-noshift"
        imagePullPolicy: IfNotPresent
        env:
        # Default splits each blob into many concurrent chunk downloads: fine
        # on a solid link, but on a flaky one all of them stall together and
        # the whole pull restarts from 0%. Cutting concurrency trades peak
        # throughput for actually finishing.
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # If gfx1201 gets detected but Ollama still falls back to CPU (a
        # known rough edge for RDNA4 as of mid-2026), uncomment and set
        # this to a supported target to force recognition:
        # - name: HSA_OVERRIDE_GFX_VERSION
        #   value: "11.0.0"
        # Builds qwen3.8:agent from the library qwen3.8:27b (Qwen3.8-27B,
        # dense, Q4_K_M with an MTP head, 16.8GB). It replaced
        # qwen3-coder-next (80B MoE, ~3B active), which kept fumbling agent
        # turns: in session 01a17af2 it searched author:renovate-bot, said
        # no Renovate PRs were open, then rewrote three PR bodies via
        # update_pull_request. Qwen reports SWE-bench Pro 61.7 vs 44.3.
        #
        # Measured 2026-10-27 against coder-next on mocked replays with
        # homelab-agent's real system prompt (renovate session above, and
        # a CrashLoopBackOff whose log says "No space left on device"):
        #   coder-next  renovate 4/5 (1x "no Renovate PRs open")
        #               crash    1/3 (2x still calling tools after 20
        #                        steps, often ones it doesn't have)
        #   qwen3.8 Q4  renovate 14/16 (1x offered to merge, never did;
        #                        1x refused without listing them)
        #               crash    5/5 (full PVC named, fix proposed)
        #   qwen3.8 Q6  renovate 11/11, crash 5/5
        # No GitHub writes from qwen3.8 in any run. Q6 (unsloth UD-Q6_K,
        # 22GB, no MTP head) was no better on these but half the speed.
        #
        # Speed, prompt tok/s reading / generating:
        #   coder-next IQ3_XXS     2517 / 65  (20k)
        #   qwen3.8 Q4 + MTP        965 / 42  (20k)   765 / 38 (75k)
        #   qwen3.8 Q4, no MTP     1035 / 27
        #   qwen3.8 Q6 / Q5         825 / 22  /  900 / 23
        # Slower, but turns are mostly cached: two agents alternating on
        # ~17k-token prompts re-read in 3-7s after the first turn.
        #
        # TEMPLATE/RENDERER/PARSER match the library model. Sampling and
        # draft_num_predict 4 (MTP speculative decoding, 27 -> 42 tok/s;
        # 2, 3 and 6 were within noise) are the library defaults, which are
        # Qwen's thinking-mode recommendation: temperature 1.0, top_p 0.95,
        # top_k 20, presence_penalty 0.
        #
        # use_mmap false - mmap'd loads stalled re-reading from Longhorn.
        # num_ctx 131072 - agent sessions run long. 16 of 64 layers are
        #   full attention, so KV is ~8.6GB f16 at 128k; 17-18GB loaded.
        #   Clients sending a different num_ctx force a reload.
        # num_batch 2048 - 512, 1024 and 4096 were all within 3%.
        # num_predict 32768 - caps one reply, thinking included. Thinking
        #   counts against the 131k context, so leave room for the prompt:
        #   ~31k fixed cost plus a compaction threshold of 70k.
        #
        # qwen3-coder-next and its blob are removed (28GB of the 100Gi PVC).
        command:
        - /bin/sh
        - -c
        - |
          set -e
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull qwen3.8:27b
          cat > /tmp/Modelfile <<'EOF'
          FROM qwen3.8:27b
          TEMPLATE {{ .Prompt }}
          RENDERER qwen3.8
          PARSER qwen3.5
          PARAMETER temperature 1
          PARAMETER top_k 20
          PARAMETER top_p 0.95
          PARAMETER min_p 0
          PARAMETER presence_penalty 0
          PARAMETER repeat_penalty 1
          PARAMETER draft_num_predict 4
          PARAMETER use_mmap false
          PARAMETER num_ctx 131072
          PARAMETER num_batch 2048
          PARAMETER num_predict 32768
          EOF
          ollama create qwen3.8:agent -f /tmp/Modelfile
          # One rm per model: a multi-arg rm stops at the first missing one.
          for m in qwen3:4b qwen3:8b qwen3-coder-next:latest \
              qwen3-coder-next:agent hf.co/unsloth/Qwen3-Coder-Next-GGUF:UD-IQ3_XXS \
              hf.co/JetBrains/Mellum2.1-12B-A2.5B-Thinking-GGUF:Q8_0; do
            ollama rm "$m" 2>/dev/null || true
          done
          kill $pid
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
            amd.com/gpu: 1
          limits:
            amd.com/gpu: 1
      containers:
      - name: ollama
        # Same patched image as pull-model above.
        image: "ghcr.io/myoung34/homelab/ollama:0.40.3-rocm-pr18433-noshift"
        imagePullPolicy: IfNotPresent
        # Serve, then preload qwen3.8:agent in the background so the
        # ~10-30s load happens at pod start instead of on the first agent
        # request. `ollama run <model> ""` is Ollama's documented preload;
        # with KEEP_ALIVE=-1 it then stays resident. The trap forwards
        # SIGTERM, since sh as PID 1 would otherwise ignore it.
        command:
        - /bin/sh
        - -c
        - |
          ollama serve &
          pid=$!
          trap 'kill -TERM $pid' TERM INT
          (
            until ollama list >/dev/null 2>&1; do sleep 1; done
            ollama run qwen3.8:agent "" >/dev/null 2>&1 || true
          ) &
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # Default (5m) unloads the model between requests, paying a ~10-30s
        # reload on the next one. This node's dedicated to Ollama, so keep
        # the coder model resident.
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        # The coder model needs the whole card plus most of host RAM; a
        # second loaded model could only fit by evicting it.
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        # One request at a time. Each extra slot adds its own context (and
        # Ollama sizes KV per slot), and there's no VRAM/RAM headroom left;
        # concurrent agents queue instead (OLLAMA_MAX_QUEUE, default 512).
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        # Default context for requests that don't set num_ctx (e.g. clients
        # hitting the bare tag); matches the :agent tag so they don't force a
        # reload at a different size.
        - name: OLLAMA_CONTEXT_LENGTH
          value: "131072"
        # Patched-in (images/ollama/context-shift.patch). When a request fills
        # num_ctx, fail it instead of letting llama-server drop the oldest
        # 65533 tokens - system prompt and user request included - and
        # generate on with no instructions. That happened 45 times in long
        # homelab-agent turns on 2026-10-19/20 and produced #2263.
        - name: OLLAMA_CONTEXT_SHIFT
          value: "false"
        # Load-stall timeout (default 5m). A cold load reads 17GB off the
        # PVC; give a slow disk or busy node headroom rather than failing.
        - name: OLLAMA_LOAD_TIMEOUT
          value: "15m"
        # Cap llama-server's host-RAM prompt state. Ollama has no knob for
        # these, but the llama-server it spawns inherits this env and reads
        # LLAMA_ARG_* for any flag Ollama doesn't pass itself.
        #
        # Defaults are an 8GiB prompt cache plus up to 32 context checkpoints
        # per slot (~75MiB each; qwen3next is hybrid/recurrent, so rolling
        # back needs a saved state). Both live in host RAM, and on Q4_K_M this
        # node had ~3.5GB free once the CPU-side experts loaded. A long session
        # grows them until the kernel OOM-kills Ollama (seen twice on
        # 2026-10-09: a 60k-token prompt took MemAvailable from 3.3GB to 0;
        # the cache logged a 67k-token prompt at 1.8GiB). Every kill costs a
        # 90s+ reload and the in-flight agent turn.
        #
        # That budget is gone: on UD-IQ3_XXS the model is all on the GPU and
        # the node sits at ~8GB used of 32GB (2026-10-15). The old 1GiB cap
        # now held nothing useful. In 24h llama-server skipped caching 85
        # prompt states (median 3.2GiB, max 3.7GiB) and fully re-read the
        # prompt 80 times, mostly when homelab-agent and printer-agent take
        # turns, which every homelab -> printer delegation does. 8GiB, the
        # llama-server default, holds both agents' prompts at once. 8
        # checkpoints (~600MiB) is plenty for append-only agent turns.
        - name: LLAMA_ARG_CACHE_RAM
          value: "8192"
        - name: LLAMA_ARG_CTX_CHECKPOINTS
          value: "8"
        # Deliberately not set, per testing/research:
        # - OLLAMA_FLASH_ATTENTION: the default (auto) already resolves to
        #   enabled on this card ("Flash Attention enabled" in load logs).
        # - OLLAMA_KV_CACHE_TYPE=q8_0: measured on IQ3_XXS at 128k / batch
        #   2048: saves 1.4GB VRAM, same prompt reading, generation 65 -> 59
        #   tok/s (-10%), HE+ 87.8 vs 88.4 (noise). The model already fits
        #   on the GPU, so the VRAM buys nothing.
        # See the HSA_OVERRIDE_GFX_VERSION note on the pull-model
        # initContainer above if the GPU isn't actually getting used.
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        # The model is all on the GPU: 1.3GiB measured loaded, plus up to
        # 8GiB of prompt cache and ~0.6GiB of checkpoints (LLAMA_ARG_* above).
        # The request covers that so the scheduler doesn't pack the node.
        # No memory limit: an OOM kill would cost a reload.
        resources:
          requests:
            cpu: 1000m
            memory: 11Gi
            amd.com/gpu: 1
          limits:
            amd.com/gpu: 1
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-data
