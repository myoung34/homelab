apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  ports:
  - name: http
    port: 11434
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/name: ollama
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: true
      # qwen3:4b needs ~2.5-3GB resident for weights; the requests below are
      # a floor so the scheduler avoids nodes that can't actually fit it.
      #
      # GPU offload (AMD Radeon RX 9060 / gfx1201 via ROCm): requesting
      # amd.com/gpu below requires the siderolabs/amdgpu Talos extension on
      # the node plus the ROCm/k8s-device-plugin DaemonSet running in the
      # cluster - both are set up outside this manifest. The device plugin
      # injects /dev/kfd + /dev/dri itself; no manual hostPath mount needed.
      # The resource request alone would already constrain scheduling to
      # gpu1 (it's the only node that will ever advertise amd.com/gpu), but
      # pin it explicitly too so intent isn't implicit.
      nodeSelector:
        kubernetes.io/hostname: gpu1
      initContainers:
      - name: pull-model
        image: "ollama/ollama:rocm"
        imagePullPolicy: IfNotPresent
        env:
        # Default splits each blob into many concurrent chunk downloads: fine
        # on a solid link, but on a flaky one all of them stall together and
        # the whole pull restarts from 0%. Cutting concurrency trades peak
        # throughput for actually finishing.
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # If gfx1201 gets detected but Ollama still falls back to CPU (a
        # known rough edge for the 9060 as of mid-2026), uncomment and set
        # this to a supported target to force recognition:
        # - name: HSA_OVERRIDE_GFX_VERSION
        #   value: "11.0.0"
        command:
        - /bin/sh
        - -c
        - |
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull qwen3:4b
          ollama rm qwen3:8b || true
          kill $pid
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
            amd.com/gpu: 1
          limits:
            amd.com/gpu: 1
      containers:
      - name: ollama
        image: "ollama/ollama:rocm"
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # Default (5m) unloads the model from VRAM between requests, paying
        # a ~150s reload (mostly reading the blob off the Longhorn-backed
        # PVC) on the next one. This node's dedicated to Ollama and qwen3:4b
        # only uses ~3GB of the card's 16GB, so just keep it resident.
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        # See the HSA_OVERRIDE_GFX_VERSION note on the pull-model
        # initContainer above if the GPU isn't actually getting used.
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 1000m
            memory: 3Gi
            amd.com/gpu: 1
          limits:
            amd.com/gpu: 1
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-data
