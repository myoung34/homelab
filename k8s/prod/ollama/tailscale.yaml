apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: ollama
spec:
  defaultBackend:
    service:
      name: ollama
      port:
        number: 11434
  ingressClassName: tailscale
  tls:
  - hosts:
    - ollama
---
# Aperture's "ollama-gp" provider (configured outside this repo) points
# at ollama-gp.king-gila.ts.net. Renaming the host means updating
# Aperture too.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-gp
  namespace: ollama
spec:
  defaultBackend:
    service:
      name: ollama-general
      port:
        number: 11434
  ingressClassName: tailscale
  tls:
  - hosts:
    - ollama-gp
