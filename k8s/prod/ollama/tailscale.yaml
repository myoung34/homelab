apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  namespace: ollama
spec:
  defaultBackend:
    service:
      name: ollama
      port:
        number: 11434
  ingressClassName: tailscale
  tls:
  - hosts:
    - ollama
---
# Old name kept: Aperture's "ollama-bonsai" provider (configured outside
# this repo) points at ollama-bonsai.king-gila.ts.net. Renaming the host
# means updating Aperture first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-bonsai
  namespace: ollama
spec:
  defaultBackend:
    service:
      name: ollama-general
      port:
        number: 11434
  ingressClassName: tailscale
  tls:
  - hosts:
    - ollama-bonsai
