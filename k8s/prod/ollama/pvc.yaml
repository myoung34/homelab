# Dynamically provisioned: the model cache is re-pullable (the pull-model
# initContainer fetches it on first start), so there's nothing to restore.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: ollama
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
  volumeMode: Filesystem
