# Bound to the static PVs in pv.yaml, which point at named Longhorn volumes
# (k8s/prod/longhorn/ollama.yaml) so they show up as ollama-data /
# ollama-general-data instead of pvc-<uid>. Snapshot/backup opt-out lives on
# the Longhorn Volumes there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: ollama
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: ollama-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-general-data
  namespace: ollama
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: ollama-general-data
