# Statically named (PV + Longhorn Volume in k8s/prod/longhorn/ollama.yaml)
# so the volume shows up as ollama-data everywhere instead of pvc-<uuid>,
# matching hass/zwave-js-ui/network-optimizer.
#
# The model cache is re-pullable (the pull-model initContainer fetches it on
# first start), so there's nothing to restore from backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: ollama
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: ollama-data
