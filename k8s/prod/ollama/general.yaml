apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: ollama-general
    app.kubernetes.io/name: ollama
  name: ollama-general
  namespace: ollama
spec:
  ports:
  - name: http
    port: 11434
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: ollama-general
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ollama-general
    app.kubernetes.io/name: ollama
  name: ollama-general
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama-general
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama-general
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: false
      # Second Ollama on cluster41, pinned to the RTX 2070 SUPER (8GB) so it
      # never competes with qwen3-coder-next on the R9700 (ollama.yaml).
      # Isolation comes from the device plugins, not from Ollama: this pod
      # requests nvidia.com/gpu and runs the CUDA image, so it only ever sees
      # the NVIDIA card; the ROCm pod requests amd.com/gpu and never gets
      # /dev/nvidia*. The 2070 needs the NVIDIA Talos extensions
      # (terraform/talos/bare.yaml) and k8s/prod/nvidia-device-plugin.
      #
      # Serves lfm2.5-24b:agent: Liquid AI's LFM2.5-24B-A2B (24B MoE, 2.45B
      # active, 10 of 40 layers attention, always thinks), as unsloth's
      # UD-IQ2_XXS quant (7.5GB) of the Preview checkpoint - the only build
      # under 8GB; the official GGUFs start at 13.6GB (Q4_0).
      #
      # Replaced bonsai-27b:agent (PrismML 1-bit Bonsai 27B) on 2026-10-13
      # after a head-to-head on this card: 47 auto-scored general-purpose
      # prompts (knowledge, reasoning, instruction following, comprehension,
      # hallucination traps, tool calls, a 21k-token recall), each model on
      # its recommended sampling at 32k ctx. LFM 47/47, bonsai 45/47 (missed
      # a lipogram by thinking past 8192 tokens, and named the wrong first
      # woman Nobel laureate in Literature). LFM generated ~90 tok/s vs ~33.
      #
      # Named for its role (the small general-purpose model), not the model.
      # Only the tailnet Ingress (ollama-bonsai.king-gila.ts.net,
      # tailscale.yaml) and Aperture's "ollama-bonsai" provider pointing at
      # it keep the old name; Aperture's config lives outside this repo.
      runtimeClassName: nvidia
      initContainers:
      - name: pull-model
        image: "ollama/ollama:0.40.4"
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # Builds lfm2.5-24b:agent: the hf.co model (its chat template and
        # stops passed tool-calling and thinking tests as-is) plus Liquid's
        # recommended sampling (temperature 0.1, top_k 50, repetition
        # penalty 1.05) and 64k context. Measured on this card (q4_0 KV,
        # 8k / 22k-token prompts, tok/s reading / generating):
        #   32k ctx: 711 (21k prompt) / ~90   89% GPU
        #   48k ctx: 602 / 82, 629 / 79       87% GPU
        #   64k ctx: 543 / 72, 574 / 71       86% GPU   <- chosen
        #  112k ctx: 367 / 38, 413 / 42       81% GPU
        # It never fits 100% on the card; the rest of the experts run from
        # host RAM (~1GiB RSS, inside the 3Gi limit below). 64k leaves room
        # for an agent's ~20k tokens of tools plus a real conversation and
        # still beats bonsai at 112k (~500 / ~30) on both.
        command:
        - /bin/sh
        - -c
        - |
          set -e
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull hf.co/unsloth/LFM2.5-24B-A2B-Preview-GGUF:UD-IQ2_XXS
          cat > /tmp/Modelfile.lfm <<'EOF'
          FROM hf.co/unsloth/LFM2.5-24B-A2B-Preview-GGUF:UD-IQ2_XXS
          PARAMETER num_ctx 65536
          PARAMETER temperature 0.1
          PARAMETER top_k 50
          PARAMETER repeat_penalty 1.05
          EOF
          ollama create lfm2.5-24b:agent -f /tmp/Modelfile.lfm
          kill $pid
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
      containers:
      - name: ollama
        image: "ollama/ollama:0.40.4"
        imagePullPolicy: IfNotPresent
        # Same serve-then-preload pattern as ollama.yaml.
        command:
        - /bin/sh
        - -c
        - |
          ollama serve &
          pid=$!
          trap 'kill -TERM $pid' TERM INT
          (
            until ollama list >/dev/null 2>&1; do sleep 1; done
            ollama run lfm2.5-24b:agent "" >/dev/null 2>&1 || true
          ) &
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        # 8GB holds one model; a second would evict the first.
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        # Matches lfm2.5-24b:agent so bare-tag requests don't force a reload
        # at a different size. (Was 114688 for bonsai.)
        - name: OLLAMA_CONTEXT_LENGTH
          value: "65536"
        # 4-bit KV, server-wide. Set for bonsai (PrismML ships it with a
        # 4-bit cache); the LFM numbers above were measured with it too, and
        # LFM's cache is small anyway (10 attention layers: 180MiB at 32k)
        # and its 21k-token recall check passed. Needs flash attention,
        # which Ollama enables by default where supported (Turing is).
        - name: OLLAMA_KV_CACHE_TYPE
          value: "q4_0"
        # Cap llama-server's host-RAM prompt state, same as ollama.yaml.
        # Defaults are an 8GiB prompt cache plus 32 context checkpoints per
        # slot; bonsai is hybrid/recurrent (qwen35), so each checkpoint
        # saves the ~150MiB recurrent state (RS buffer in load logs), up to
        # ~4.8GB. qwen leaves ~1.7GB free on the node, so the first Aperture
        # chat grew llama-server to 2.6GB RSS and the kernel OOM-killed it
        # (2026-10-12 17:34). LFM2.5 is hybrid too (short-conv blocks carry
        # state), so the same caps apply.
        #
        # Prompt cache off: one slot, so the previous turn's KV already
        # sits on the GPU and is reused without it. 4 checkpoints
        # (~600MiB) cover rollback for append-only chat/agent turns.
        - name: LLAMA_ARG_CACHE_RAM
          value: "0"
        - name: LLAMA_ARG_CTX_CHECKPOINTS
          value: "4"
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        # Most of the model lives on the GPU; LFM's CPU-side experts
        # (~14% at 64k) are read from page cache. Measured ~0.8-1.1GiB pod
        # memory under load at 32k-112k. Kept small: qwen3-coder-next
        # requests 26Gi of the node's 32GB.
        #
        # The memory limit is a fence, not a budget: ~1GiB steady state
        # plus checkpoints fits well under it. If llama-server still
        # runs away, its own cgroup OOMs and only it restarts (seconds: the
        # model is local) instead of a node-wide OOM that can take out
        # qwen (a 90s+ reload) or other pods.
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
            nvidia.com/gpu: 1
          limits:
            memory: 3Gi
            nvidia.com/gpu: 1
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-general-data
