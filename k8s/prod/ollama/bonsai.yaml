apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: ollama-bonsai
    app.kubernetes.io/name: ollama
  name: ollama-bonsai
  namespace: ollama
spec:
  ports:
  - name: http
    port: 11434
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: ollama-bonsai
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ollama-bonsai
    app.kubernetes.io/name: ollama
  name: ollama-bonsai
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama-bonsai
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama-bonsai
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: false
      # Second Ollama on cluster41, pinned to the RTX 2070 SUPER (8GB) so it
      # never competes with qwen3-coder-next on the R9700 (ollama.yaml).
      # Isolation comes from the device plugins, not from Ollama: this pod
      # requests nvidia.com/gpu and runs the CUDA image, so it only ever sees
      # the NVIDIA card; the ROCm pod requests amd.com/gpu and never gets
      # /dev/nvidia*. The 2070 needs the NVIDIA Talos extensions
      # (terraform/talos/bare.yaml) and k8s/prod/nvidia-device-plugin.
      #
      # Serves MichelRosselli/bonsai-27b:Q1_0 (4.4GB): PrismML's 1-bit
      # Bonsai 27B (Qwen3.6-27B hybrid attention, GGUF Q1_0_g128). Q1_0
      # needs Ollama >= 0.32.5 (the model's `requires`); stock Ollama
      # crashed on it before the llama.cpp sync.
      runtimeClassName: nvidia
      initContainers:
      - name: pull-model
        image: "ollama/ollama:0.40.3"
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # Builds bonsai-27b:agent, text-only, at a context that fits the 8GB
        # card fully on GPU. The library tag bundles a vision projector
        # (~0.6GB VRAM, loaded even for text) and defaults to 262144 ctx, so
        # :agent is rebuilt from the tag's language-model blob only (its
        # first FROM line), keeping the tag's renderer, parser, stops and
        # PrismML's sampling (temperature 0.7, top_p 0.95, top_k 20).
        #
        # Measured on the 2070 (Ollama 0.40.3, 2026-10-12), 8k / 22k-token
        # prompts, tok/s reading / generating:
        #   with projector, q8_0 KV:  32k ctx 530/31, 480/26 (100% GPU)
        #                             64k spills 11% to CPU: gen 16.7
        #   text-only, q4_0 KV:      112k ctx 525/30.5     (100% GPU)
        #                            128k spills 10% to CPU: gen 15-20
        # So 112k costs nothing over 32k. A 56k-token prompt reads at
        # 384 tok/s (146s), generates at 20.7, and still recalls a fact
        # planted near its start. Vision is gone; no client sends images.
        command:
        - /bin/sh
        - -c
        - |
          set -e
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull MichelRosselli/bonsai-27b:Q1_0
          # Everything from the tag's Modelfile except the projector FROM,
          # the LICENSE blocks and its 262144 num_ctx.
          ollama show --modelfile MichelRosselli/bonsai-27b:Q1_0 \
            | awk '/^FROM /{if(f++)next} /^LICENSE/{skip=1}
                   !skip && !/^PARAMETER num_ctx/ && !/^#/' > /tmp/Modelfile
          echo 'PARAMETER num_ctx 114688' >> /tmp/Modelfile
          cat /tmp/Modelfile
          ollama create bonsai-27b:agent -f /tmp/Modelfile
          kill $pid
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
      containers:
      - name: ollama
        image: "ollama/ollama:0.40.3"
        imagePullPolicy: IfNotPresent
        # Same serve-then-preload pattern as ollama.yaml.
        command:
        - /bin/sh
        - -c
        - |
          ollama serve &
          pid=$!
          trap 'kill -TERM $pid' TERM INT
          (
            until ollama list >/dev/null 2>&1; do sleep 1; done
            ollama run bonsai-27b:agent "" >/dev/null 2>&1 || true
          ) &
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        # 8GB holds one model; a second would evict bonsai.
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        # Matches the :agent tag so bare-tag requests don't reload at 256k.
        - name: OLLAMA_CONTEXT_LENGTH
          value: "114688"
        # 4-bit KV: a quarter of f16, which is what lets 112k fit (numbers
        # on the pull-model initContainer). PrismML ships bonsai with a
        # 4-bit KV cache and reports it near-lossless; the 56k-token recall
        # check passed with it. Server-wide, which is fine: this instance
        # only serves bonsai. Needs flash attention, which Ollama enables by
        # default where supported (Turing is).
        - name: OLLAMA_KV_CACHE_TYPE
          value: "q4_0"
        # Cap llama-server's host-RAM prompt state, same as ollama.yaml.
        # Defaults are an 8GiB prompt cache plus 32 context checkpoints per
        # slot; bonsai is hybrid/recurrent (qwen35), so each checkpoint
        # saves the ~150MiB recurrent state (RS buffer in load logs), up to
        # ~4.8GB. qwen leaves ~1.7GB free on the node, so the first Aperture
        # chat grew llama-server to 2.6GB RSS and the kernel OOM-killed it
        # (2026-10-12 17:34).
        #
        # Prompt cache off: one slot, so the previous turn's KV already
        # sits on the GPU and is reused without it. 4 checkpoints
        # (~600MiB) cover rollback for append-only chat/agent turns.
        - name: LLAMA_ARG_CACHE_RAM
          value: "0"
        - name: LLAMA_ARG_CTX_CHECKPOINTS
          value: "4"
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        # The model lives on the GPU; host RAM is mostly page cache from
        # the load. Kept small: qwen3-coder-next requests 26Gi of the
        # node's 32GB.
        #
        # The memory limit is a fence, not a budget: ~1.3GiB steady state
        # plus ~600MiB of checkpoints fits well under it. If bonsai still
        # runs away, its own cgroup OOMs and only it restarts (seconds: the
        # model is local) instead of a node-wide OOM that can take out
        # qwen (a 90s+ reload) or other pods.
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
            nvidia.com/gpu: 1
          limits:
            memory: 3Gi
            nvidia.com/gpu: 1
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-bonsai-data
