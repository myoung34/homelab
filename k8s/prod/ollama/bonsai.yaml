apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: ollama-bonsai
    app.kubernetes.io/name: ollama
  name: ollama-bonsai
  namespace: ollama
spec:
  ports:
  - name: http
    port: 11434
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: ollama-bonsai
    app.kubernetes.io/name: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: ollama-bonsai
    app.kubernetes.io/name: ollama
  name: ollama-bonsai
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ollama-bonsai
      app.kubernetes.io/name: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ollama-bonsai
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: false
      # Second Ollama on cluster41, pinned to the RTX 2070 SUPER (8GB) so it
      # never competes with qwen3-coder-next on the R9700 (ollama.yaml).
      # Isolation comes from the device plugins, not from Ollama: this pod
      # requests nvidia.com/gpu and runs the CUDA image, so it only ever sees
      # the NVIDIA card; the ROCm pod requests amd.com/gpu and never gets
      # /dev/nvidia*. The 2070 needs the NVIDIA Talos extensions
      # (terraform/talos/bare.yaml) and k8s/prod/nvidia-device-plugin.
      #
      # Serves MichelRosselli/bonsai-27b:Q1_0 (4.4GB): PrismML's 1-bit
      # Bonsai 27B (Qwen3.6-27B hybrid attention, GGUF Q1_0_g128) with its
      # Q8_0 vision projector. Q1_0 needs Ollama >= 0.32.5 (the model's
      # `requires`); stock Ollama crashed on it before the llama.cpp sync.
      runtimeClassName: nvidia
      initContainers:
      - name: pull-model
        image: "ollama/ollama:0.40.3"
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        # Builds bonsai-27b:agent: the library tag (which already carries
        # PrismML's sampling: temperature 0.7, top_p 0.95, top_k 20) with a
        # context that fits the 8GB card. The tag defaults to 262144, whose
        # KV cache alone is several GB. Back-of-envelope from the model
        # card (full attention on 16 of 64 layers, ~65KB/token at f16):
        #   3.8GB weights + 0.6GB projector + ~1.3GB runtime buffers
        #   + 32k tokens * ~35KB/token (q8_0 KV, below) ~= 1.1GB
        #   ~= 6.8GB of 8GB. 64k would land at ~7.9GB and spill to CPU.
        # Unmeasured on this card; `ollama ps` should show 100% GPU.
        command:
        - /bin/sh
        - -c
        - |
          set -e
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do sleep 1; done
          ollama pull MichelRosselli/bonsai-27b:Q1_0
          cat > /tmp/Modelfile <<'EOF'
          FROM MichelRosselli/bonsai-27b:Q1_0
          PARAMETER num_ctx 32768
          EOF
          ollama create bonsai-27b:agent -f /tmp/Modelfile
          kill $pid
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
      containers:
      - name: ollama
        image: "ollama/ollama:0.40.3"
        imagePullPolicy: IfNotPresent
        # Same serve-then-preload pattern as ollama.yaml.
        command:
        - /bin/sh
        - -c
        - |
          ollama serve &
          pid=$!
          trap 'kill -TERM $pid' TERM INT
          (
            until ollama list >/dev/null 2>&1; do sleep 1; done
            ollama run bonsai-27b:agent "" >/dev/null 2>&1 || true
          ) &
          wait $pid
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MAX_TRANSFER_STREAMS
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        # 8GB holds one model; a second would evict bonsai.
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        # Matches the :agent tag so bare-tag requests don't reload at 256k.
        - name: OLLAMA_CONTEXT_LENGTH
          value: "32768"
        # Halves the KV cache vs f16 so 32k fits on the card. Server-wide,
        # which is fine here: this instance only serves bonsai. PrismML
        # ships it with a 4-bit KV cache and reports it near-lossless, so
        # q8_0 is conservative. Needs flash attention, which Ollama enables
        # by default where supported (Turing is).
        - name: OLLAMA_KV_CACHE_TYPE
          value: "q8_0"
        # Cap llama-server's host-RAM prompt state, same as ollama.yaml.
        # Defaults are an 8GiB prompt cache plus 32 context checkpoints per
        # slot; bonsai is hybrid/recurrent (qwen35), so each checkpoint
        # saves the ~150MiB recurrent state (RS buffer in load logs), up to
        # ~4.8GB. qwen leaves ~1.7GB free on the node, so the first Aperture
        # chat grew llama-server to 2.6GB RSS and the kernel OOM-killed it
        # (2026-10-12 17:34).
        #
        # Prompt cache off: one slot, so the previous turn's KV already
        # sits on the GPU and is reused without it. 4 checkpoints
        # (~600MiB) cover rollback for append-only chat/agent turns.
        - name: LLAMA_ARG_CACHE_RAM
          value: "0"
        - name: LLAMA_ARG_CTX_CHECKPOINTS
          value: "4"
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
        # The model lives on the GPU; host RAM is mostly page cache from
        # the load. Kept small: qwen3-coder-next requests 26Gi of the
        # node's 32GB.
        #
        # The memory limit is a fence, not a budget: ~1.3GiB steady state
        # plus ~600MiB of checkpoints fits well under it. If bonsai still
        # runs away, its own cgroup OOMs and only it restarts (seconds: the
        # model is local) instead of a node-wide OOM that can take out
        # qwen (a 90s+ reload) or other pods.
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
            nvidia.com/gpu: 1
          limits:
            memory: 3Gi
            nvidia.com/gpu: 1
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 60
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-bonsai-data
