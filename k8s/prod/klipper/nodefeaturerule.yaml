# Per-printer node labels keyed on the Klipper MCU's USB serial number.
#
# All Klipper MCUs enumerate with the same VID/PID (1d50:614e, OpenMoko/Klipper,
# CDC class 02), so the generic NFD label
# feature.node.kubernetes.io/usb-02_1d50_614e.present cannot distinguish two
# printers plugged into different nodes. Adding "serial" to the worker's
# deviceLabelFields would rename every existing usb-* label (breaking the zooz
# affinity in ser2net, etc.), so instead these rules add per-serial labels
# without touching the existing ones.
#
# The serial is the middle chunk of the /dev/serial/by-id symlink:
#   usb-Klipper_stm32g0b1xx_<SERIAL>-if00
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: klipper-printers
spec:
  rules:
    - name: klipper-enderright
      labels:
        "feature.node.kubernetes.io/klipper-enderright": "true"
      matchFeatures:
        - feature: usb.device
          matchExpressions:
            vendor: {op: In, value: ["1d50"]}
            device: {op: In, value: ["614e"]}
            serial: {op: In, value: ["43002E000C50564837383420"]}
    # Uncomment and fill in the serials when the other printers come online:
    # - name: klipper-enderleft
    #   labels:
    #     "feature.node.kubernetes.io/klipper-enderleft": "true"
