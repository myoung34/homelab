apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No kustomization-level namespace: it would also get stamped onto the
# cluster-scoped NodeFeatureRule and break apply. Namespaced resources carry
# an explicit metadata.namespace instead.

# One file pair per printer: <name>-configmap.yaml (printer.cfg seed) and
# <name>.yaml (PV/PVC/Deployment/Service/Ingress).
resources:
  - namespace.yaml
  - nodefeaturerule.yaml
  - moonraker-configmap.yaml
  - enderleft-configmap.yaml
  - enderleft.yaml
  - enderbig-configmap.yaml
  - enderbig.yaml
#  - enderright-configmap.yaml
#  - enderright.yaml
