# enderleft: Ender 3 (BTT SKR mini e3 v3) running Klipper + Moonraker.
# Pinned to whichever node has the MCU's USB serial plugged in (see
# nodefeaturerule.yaml). Fluidd (k8s/prod/fluidd) is the UI; add
# https://enderleft as a printer instance in it.
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: enderleft
  namespace: klipper
  labels:
    app.kubernetes.io/name: klipper
    app.kubernetes.io/instance: enderleft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: klipper
      app.kubernetes.io/instance: enderleft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: klipper
        app.kubernetes.io/instance: enderleft
      annotations:
        # klippy.log is a file on the PVC (Klipper's -l), not stdout; the
        # Datadog agent tails it through its kubelet-pods mount (see
        # k8s/prod/datadog). Stats lines (~1/s, ~40 MB/day) are dropped; they
        # stay in the file, readable through Moonraker.
        ad.datadoghq.com/klipper.logs: '[{"type": "file", "path": "/host/var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/klipper-enderleft-data/mount/logs/klippy.log", "source": "klipper", "service": "klippy", "log_processing_rules": [{"type": "exclude_at_match", "name": "drop_stats", "pattern": "^Stats "}]}]'
        # Moonraker already logs to stdout; this only tags it.
        ad.datadoghq.com/moonraker.logs: '[{"source": "moonraker", "service": "moonraker"}]'
    spec:
      # Lets moonraker see klippy's PID, so its "restart klipper" service
      # button (supervisorctl shim in moonraker-configmap.yaml) can SIGTERM
      # klippy and have kubelet restart just the klipper container.
      shareProcessNamespace: true
      initContainers:
        # Seed configs onto the PVC on first boot only; SAVE_CONFIG and fluidd
        # config edits need printer.cfg writable, so it lives on the PVC after.
        - name: seed-config
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              set -eux
              cfg=/opt/printer_data
              mkdir -p "$cfg/config" "$cfg/gcodes" "$cfg/logs" "$cfg/run"
              if [ ! -f "$cfg/config/printer.cfg" ]; then cp /seed/printer.cfg "$cfg/config/printer.cfg"; fi
              if [ ! -f "$cfg/config/moonraker.conf" ]; then cp /seed-moonraker/moonraker.conf "$cfg/config/moonraker.conf"; fi
              # PVCs seeded before the supervisorctl shim still say provider: none.
              sed -i 's/^provider: none$/provider: supervisord_cli/' "$cfg/config/moonraker.conf"
              ls -la "$cfg/config"
              chown -R 1000:1000 "$cfg"
          volumeMounts:
            - name: printer-data
              mountPath: /opt/printer_data
            - name: printer-cfg-seed
              mountPath: /seed
            - name: moonraker-conf-seed
              mountPath: /seed-moonraker
      containers:
        - name: klipper
          image: mkuf/klipper:latest
          args:
            - "-l"
            - "/opt/printer_data/logs/klippy.log"
            - "-a"
            - "/opt/printer_data/run/klipper.sock"
            - "/opt/printer_data/config/printer.cfg"
          resources: {}
          securityContext:
            # Run as root so klipper can open the USB serial (0600 root:root).
            # Container is already privileged for USB access, so this is not
            # an additional isolation loss.
            runAsUser: 0
            allowPrivilegeEscalation: true
            privileged: true
          volumeMounts:
            # The mkuf/klipper image declares VOLUME on config/gcodes/logs/run.
            # Without explicit subPath mounts here, containerd covers those
            # paths with anonymous ephemeral volumes on the node's own disk,
            # hiding the PVC contents (and the seed-config output). Explicit
            # subPath mounts override that.
            - name: printer-data
              mountPath: /opt/printer_data
            - name: printer-data
              mountPath: /opt/printer_data/config
              subPath: config
            - name: printer-data
              mountPath: /opt/printer_data/gcodes
              subPath: gcodes
            - name: printer-data
              mountPath: /opt/printer_data/logs
              subPath: logs
            - name: printer-data
              mountPath: /opt/printer_data/run
              subPath: run
            - name: usb-mcu
              mountPath: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4800420008504E5238363120-if00
        - name: moonraker
          image: mkuf/moonraker:latest
          args:
            - "-d"
            - "/opt/printer_data"
          resources: {}
          securityContext:
            # Klipper's unix socket is created as root:root; moonraker needs
            # to connect to it, so run as the same UID.
            runAsUser: 0
          ports:
            - containerPort: 7125
              protocol: TCP
          volumeMounts:
            - name: printer-data
              mountPath: /opt/printer_data
            - name: printer-data
              mountPath: /opt/printer_data/config
              subPath: config
            - name: printer-data
              mountPath: /opt/printer_data/gcodes
              subPath: gcodes
            - name: printer-data
              mountPath: /opt/printer_data/logs
              subPath: logs
            - name: printer-data
              mountPath: /opt/printer_data/run
              subPath: run
            # mkuf's slim moonraker image lacks klipper's example configs and
            # docs directories; moonraker warns on their absence. Mount empty
            # stubs so the paths exist and validation passes.
            - name: klipper-config-stub
              mountPath: /opt/klipper/config
            - name: klipper-docs-stub
              mountPath: /opt/klipper/docs
            - name: supervisorctl-shim
              mountPath: /usr/local/bin/supervisorctl
              subPath: supervisorctl
      volumes:
        - name: klipper-config-stub
          emptyDir: {}
        - name: klipper-docs-stub
          emptyDir: {}
        - name: printer-data
          persistentVolumeClaim:
            claimName: klipper-enderleft-data
        - name: printer-cfg-seed
          configMap:
            name: klipper-enderleft-printer-cfg
        - name: moonraker-conf-seed
          configMap:
            name: moonraker
            items:
              - key: moonraker.conf
                path: moonraker.conf
        - name: supervisorctl-shim
          configMap:
            name: moonraker
            defaultMode: 0755
            items:
              - key: supervisorctl
                path: supervisorctl
        - name: usb-mcu
          hostPath:
            path: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4800420008504E5238363120-if00
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            # Per-serial label from nodefeaturerule.yaml, exact to this
            # printer's MCU. No fallback term: every Klipper MCU shares
            # VID/PID 1d50:614e, so with multiple printers only the
            # per-serial labels pin correctly.
            - matchExpressions:
              - key: feature.node.kubernetes.io/klipper-enderleft
                operator: Exists
---
kind: Service
apiVersion: v1
metadata:
  name: enderleft
  namespace: klipper
  labels:
    app.kubernetes.io/name: klipper
    app.kubernetes.io/instance: enderleft
spec:
  selector:
    app.kubernetes.io/name: klipper
    app.kubernetes.io/instance: enderleft
  ports:
    - name: moonraker
      protocol: TCP
      port: 7125
      targetPort: 7125
---
# Moonraker API over tailscale; fluidd (browser-side) talks to this directly,
# so it must be reachable from the tailnet, not just in-cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enderleft
  namespace: klipper
spec:
  defaultBackend:
    service:
      name: enderleft
      port:
        number: 7125
  ingressClassName: tailscale
  tls:
  - hosts:
    - enderleft
