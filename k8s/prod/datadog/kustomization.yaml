apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: datadog

resources:
  - namespace.yaml
  - vault.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: datadog
    patch: |-
      - op: add
        path: /spec/revisionHistoryLimit
        value: 3

helmCharts:
- name: datadog
  releaseName: datadog
  namespace: datadog
  version: 3.240.0
  includeCRDs: true
  repo: https://helm.datadoghq.com
  valuesInline:
    providers:
      talos:
        enabled: true
    datadog:
      ignoreAutoConfig:
        - kube_scheduler
        - kube_controller_manager
      clusterName: prod
      confd:
        argocd.yaml: |-
          instances:
            -
              app_controller_endpoint: http://argocd-application-controller-metrics.argocd.svc.cluster.local:8082/metrics
              api_server_endpoint: http://argocd-server-metrics.argocd.svc.cluster.local:8083/metrics
              repo_server_endpoint: http://argocd-repo-server-metrics.argocd.svc.cluster.local:8084/metrics
      orchestratorExplorer:
        kubelet_configuration_check:
          enabled: false
      apiKeyExistingSecret:  datadog
      logs:
        enabled: true
        containerCollectAll: true
      networkMonitoring:
        enabled: true
      serviceMonitoring:
        enabled: true
      systemProbe:
        mountPackageManagementDirs:
        - name: "public-key-dir"
          hostPath: /etc/pki
          mountPath: /host/etc/pki
      envFrom:
        - secretRef:
            name: datadog
    agents:
      volumes:
        - hostPath:
            path: /sys/kernel/tracing
          name: tracefs
      volumeMounts:
        - mountPath: /sys/kernel/tracing
          mountPropagation: None
          name: tracefs
          readOnly: false # Need RW for kprobe_events
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
      containers:
        agent:
          resources:
            requests:
              cpu: 1469m
              memory: 298M
            limits:
              cpu: 1469m
              memory: 298M
        processAgent:
          resources:
            requests:
              cpu: 78m
              memory: 64M
            limits:
              cpu: 78m
              memory: 64M
        systemProbe:
          resources:
            requests:
              # Steady state is 276-363Mi with networkMonitoring + serviceMonitoring
              # both on. eBPF maps are kernel allocations charged to the container
              # memcg (GFP_KERNEL_ACCOUNT), so they count on top of RSS -- the old
              # 384M (= 366Mi) limit sat right on peak usage and OOM-killed on
              # nearly every node. Request tracks steady state, limit leaves room
              # for map churn without reserving it on the 3.1Gi nodes.
              cpu: 200m
              memory: 448Mi
            limits:
              # BPF program loading + verification at startup is CPU-bursty; the
              # previous 78m limit throttled it into probe failures.
              cpu: 1
              memory: 768Mi
        traceAgent:
          resources:
            requests:
              cpu: 78m
              memory: 37M
            limits:
              cpu: 78m
              memory: 37M
    clusterAgent:
      tokenExistingSecret: datadog-cluster-agent # pragma: allowlist secret
