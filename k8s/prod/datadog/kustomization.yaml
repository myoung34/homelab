apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: datadog

resources:
  - namespace.yaml
  - vault.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: datadog
    patch: |-
      - op: add
        path: /spec/revisionHistoryLimit
        value: 3

helmCharts:
- name: datadog
  releaseName: datadog
  namespace: datadog
  version: 3.277.0
  includeCRDs: true
  repo: https://helm.datadoghq.com
  valuesInline:
    providers:
      talos:
        enabled: true
    datadog:
      ignoreAutoConfig:
        - kube_scheduler
        - kube_controller_manager
        # Off entirely. Even at a 120s interval each scrape pulled ~35k
        # samples and took 10-34s per control-plane node, and nothing
        # (dashboard or monitor) reads the metrics.
        - kube_apiserver_metrics
        # The bundled auto_conf scrapes cilium-agent :9962, which isn't
        # enabled here - it never succeeded on any node and its tracebacks
        # were most of the agent's ~76k error logs/day.
        - cilium
      clusterName: prod
      # Info is check start/finish chatter: ~58k lines/day steady, far more
      # on every rollout. Bump back to info while debugging the agent.
      logLevel: WARN
      orchestratorExplorer:
        kubelet_configuration_check:
          enabled: false
      apiKeyExistingSecret:  datadog
      logs:
        enabled: true
        containerCollectAll: true
      networkMonitoring:
        enabled: true
      # Universal Service Monitoring off: billed as 10 APM hosts and adds
      # eBPF HTTP tracing on every Pi, while nothing (dashboard or monitor)
      # read its universal.http.* metrics. NPM (networkMonitoring) stays.
      serviceMonitoring:
        enabled: false
      systemProbe:
        mountPackageManagementDirs:
        - name: "public-key-dir"
          hostPath: /etc/pki
          mountPath: /host/etc/pki
      envFrom:
        - secretRef:
            name: datadog
    agents:
      # tracefs (/sys/kernel/tracing, RW for system-probe's kprobe_events)
      # used to be added here; the chart mounts it itself since 3.261.0, and
      # a second copy breaks ArgoCD's diff (duplicate volume/mountPath).
      volumes:
        # Lets the agent tail log files that apps write to their own volumes
        # instead of stdout - klippy.log, on each printer's Longhorn PVC (see
        # the ad.datadoghq.com/klipper.logs annotation in k8s/prod/klipper).
        # HostToContainer so CSI volumes mounted after the agent started are
        # visible. Read-only; system-probe already mounts the whole host root.
        - hostPath:
            path: /var/lib/kubelet/pods
          name: kubelet-pods
      volumeMounts:
        - mountPath: /host/var/lib/kubelet/pods
          mountPropagation: HostToContainer
          name: kubelet-pods
          readOnly: true
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
        - key: "homelab/zwave-usb"
          operator: "Exists"
          effect: "NoSchedule"
        # Keep monitoring the nodes that are struggling.
        - key: "homelab/io-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        agent:
          # Sized from 14 days of container.cpu.usage / memory.working_set.
          # The agent sat pinned at its old 1469m limit on every node, so p95
          # (1274m) is a floor, not its real demand. No CPU limit: throttling
          # it just drops checks. Cutting what it collects is the real fix.
          # Done: argocd is now a single cluster check and the apiserver and
          # cilium checks are off. Before that cut, 7-day usage was 309m avg /
          # 361m max per node, so 1300m reserved 13 cores across 10 nodes for
          # ~3 cores of work (41% of all cluster CPU requests). It's only a
          # request - no limit - so a busy node can still burst past it.
          resources:
            requests:
              cpu: 500m
              memory: 352Mi
            limits:
              memory: 448Mi
        processAgent:
          resources:
            requests:
              cpu: 15m
              memory: 72Mi
            limits:
              cpu: 100m
              memory: 88Mi
        systemProbe:
          resources:
            requests:
              # eBPF maps are kernel allocations charged to the container
              # memcg (GFP_KERNEL_ACCOUNT), so they count on top of RSS -- the old
              # 384M (= 366Mi) limit sat right on peak usage and OOM-killed on
              # nearly every node. Measured 598Mi p95 / 650Mi max over 14 days
              # with networkMonitoring + serviceMonitoring on, above the old
              # 448Mi request, so the request now tracks p95.
              cpu: 200m
              memory: 736Mi
            limits:
              # BPF program loading + verification at startup is CPU-bursty; the
              # previous 78m limit throttled it into probe failures.
              cpu: 925m
              memory: 992Mi
        traceAgent:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
    clusterAgent:
      tokenExistingSecret: datadog-cluster-agent # pragma: allowlist secret
      confd:
        # A cluster check, so the cluster agent hands it to exactly one node
        # agent. As a plain datadog.confd file every node agent ran it: 10
        # copies of a 2.4-8.8s, 2.9k-sample scrape every 15s, and every
        # argocd.* metric (e.g. app.info) summed 10x on the dashboard.
        argocd.yaml: |-
          cluster_check: true
          init_config:
          instances:
            - app_controller_endpoint: http://argocd-application-controller-metrics.argocd.svc.cluster.local:8082/metrics
              api_server_endpoint: http://argocd-server-metrics.argocd.svc.cluster.local:8083/metrics
              repo_server_endpoint: http://argocd-repo-server-metrics.argocd.svc.cluster.local:8084/metrics
      resources:
        requests:
          cpu: 400m
          memory: 480Mi
        limits:
          cpu: 800m
          memory: 640Mi
    operator:
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          cpu: 100m
          memory: 64Mi
