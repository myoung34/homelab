apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex
  namespace: plex
  annotations:
    # Public via Funnel so Plex apps work off-tailnet. Every request still
    # needs a plex.tv sign-in, and the home IP stays hidden behind Tailscale.
    tailscale.com/funnel: "true"
spec:
  defaultBackend:
    service:
      name: plex
      port:
        number: 32400
  ingressClassName: tailscale
  tls:
  - hosts:
    - plex
