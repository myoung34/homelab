apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: bifrost
    app.kubernetes.io/name: bifrost
  name: bifrost
  namespace: bifrost
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: bifrost
    app.kubernetes.io/name: bifrost
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: bifrost
    secret.reloader.stakater.com/reload: bifrost
  labels:
    app.kubernetes.io/instance: bifrost
    app.kubernetes.io/name: bifrost
  name: bifrost
  namespace: bifrost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bifrost
      app.kubernetes.io/name: bifrost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: bifrost
        app.kubernetes.io/name: bifrost
    spec:
      automountServiceAccountToken: true
      # Longhorn mounts /app/data owned by root; Bifrost runs as uid/gid 1000
      # and needs write access for config.db/logs.db, so chown the volume's
      # group to match via fsGroup.
      securityContext:
        fsGroup: 1000
      containers:
      - env:
        - name: APP_PORT
          value: "8080"
        - name: APP_HOST
          value: "0.0.0.0"
        - name: LOG_LEVEL
          value: "info"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: bifrost
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: ANTHROPIC_API_KEY
              name: bifrost
              optional: true
        image: "maximhq/bifrost:latest"
        imagePullPolicy: IfNotPresent
        name: bifrost
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/data/config.json
          subPath: config.json
        resources:
          requests:
            cpu: 15m
            memory: 128M
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 30
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bifrost-data
      - name: config
        configMap:
          name: bifrost
