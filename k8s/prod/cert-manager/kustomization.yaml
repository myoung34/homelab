apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - namespace.yaml
  - vault.yaml
  - clusterissuer.yaml

helmCharts:
- name: cert-manager
  includeCRDs: true
  namespace: cert-manager
  releaseName: cert-manager
  version: v1.21.3
  repo: https://charts.jetstack.io
  valuesInline:
    crds:
      enabled: true
    # Check DNS-01 propagation against public resolvers, not the in-cluster
    # chain (NextDNS upstream).
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
