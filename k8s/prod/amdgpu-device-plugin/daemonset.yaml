apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin
  namespace: amdgpu-device-plugin
  labels:
    app.kubernetes.io/instance: amdgpu-device-plugin
    app.kubernetes.io/name: amdgpu-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: amdgpu-device-plugin
      app.kubernetes.io/name: amdgpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: amdgpu-device-plugin
        app.kubernetes.io/name: amdgpu-device-plugin
    spec:
      # Only nodes with an AMD GPU, as labelled by NFD
      # (k8s/prod/node-feature-discovery/amd-gpu-nodefeaturerule.yaml).
      nodeSelector:
        feature.node.kubernetes.io/amd-gpu: "true"
      priorityClassName: system-node-critical
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      containers:
      - name: amdgpu-device-plugin
        image: "rocm/k8s-device-plugin:1.31.0.11"
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 15m
            memory: 64M
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: sys
          mountPath: /sys
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: sys
        hostPath:
          path: /sys
