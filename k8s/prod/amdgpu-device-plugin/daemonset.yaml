apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin
  namespace: amdgpu-device-plugin
  labels:
    app.kubernetes.io/instance: amdgpu-device-plugin
    app.kubernetes.io/name: amdgpu-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: amdgpu-device-plugin
      app.kubernetes.io/name: amdgpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: amdgpu-device-plugin
        app.kubernetes.io/name: amdgpu-device-plugin
    spec:
      # Only gpu1 has the siderolabs/amdgpu extension + real hardware right
      # now; this also happens to be the only amd64 node in an otherwise
      # arm64 cluster, so this is a reasonable proxy selector.
      nodeSelector:
        kubernetes.io/arch: amd64
      priorityClassName: system-node-critical
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      containers:
      - name: amdgpu-device-plugin
        image: "rocm/k8s-device-plugin:latest"
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 15m
            memory: 64M
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: sys
          mountPath: /sys
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: sys
        hostPath:
          path: /sys
