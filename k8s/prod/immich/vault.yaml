---
# DB credentials live in Vault (kv-v2 path secret/immich, key DB_URL).
#
# Setup outside git (DB, extensions, Vault policy and role): README.md.

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich
spec:
  vaultAuthRef: immich
  mount: secret/
  type: kv-v2
  path: immich
  refreshAfter: 60s
  destination:
    create: true
    name: immich
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: immich
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: immich
    serviceAccount: default
