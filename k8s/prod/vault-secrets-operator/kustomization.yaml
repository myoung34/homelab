apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault-secrets-operator

resources:
  - namespace.yaml
  - sa.yaml

helmCharts:
- name: vault-secrets-operator
  includeCRDs: true
  namespace: vault-secrets-operator
  releaseName: vault-secrets-operator
  version: 1.6.2
  repo: https://helm.releases.hashicorp.com
  valuesInline:
    defaultVaultConnection:
      enabled: true
      address: "http://192.168.3.2:8200"
      skipTLSVerify: true
    controller:
      kubeRbacProxy:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 80Mi
      manager:
        resources:
          requests:
            cpu: 20m
            memory: 40Mi
          limits:
            cpu: 100m
            memory: 64Mi
