apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/name: prowlarr
  name: prowlarr
spec:
  ports:
  - name: http
    port: 9696
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/name: prowlarr
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: prowlarr
  labels:
    app.kubernetes.io/instance: prowlarr
    app.kubernetes.io/name: prowlarr
  name: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: prowlarr
      app.kubernetes.io/name: prowlarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: prowlarr
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: true
      serviceAccountName: default
      containers:
      # Prowlarr needs no port forwarded in - it needs its *outbound* indexer
      # traffic to leave from the seedbox. Trackers see the announce from the
      # seedbox IP and the search from a residential IP otherwise, which some
      # private trackers treat as account sharing. -D gives a local SOCKS5
      # proxy; Prowlarr's global proxy setting points at it.
      - name: seedbox-tunnel
        image: alpine:3.24.2
        command:
        - sh
        - '-c'
        - |
          set -eu
          apk add --no-cache openssh-client autossh >/dev/null

          install -d -m 0700 /run/ssh
          install -m 0600 /vault/SEEDBOX_SSH_KEY /run/ssh/id_ed25519

          cat > /run/ssh/known_hosts <<'EOF'
          lt5-1-87vecchio.pulsedmedia.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINkMoxFptrdr+HNzOtfNQP8GakBqEwd57uXt8fMXLpmj
          EOF

          exec autossh -M 0 -N -T \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/run/ssh/known_hosts \
            -o IdentitiesOnly=yes \
            -i /run/ssh/id_ed25519 \
            -D 127.0.0.1:1080 \
            vilpengu@lt5-1-87vecchio.pulsedmedia.com
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /vault
          name: vault
          readOnly: true
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:2.6.5
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1026"
        - name: PGID
          value: "100"
        - name: UMASK
          value: "002"
        - name: TZ
          value: "America/Chicago"
        ports:
        - containerPort: 9696
          name: http
          protocol: TCP
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 256Mi
        volumeMounts:
        - mountPath: /config
          name: config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config
      - name: vault
        secret:
          secretName: prowlarr # pragma: allowlist secret
          defaultMode: 0400
