---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: prowlarr
spec:
  vaultAuthRef: prowlarr
  mount: secret/
  type: kv-v2
  path: prowlarr
  refreshAfter: 60s
  destination:
    create: true
    name: prowlarr
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: prowlarr
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: prowlarr
    serviceAccount: default
