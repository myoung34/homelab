apiVersion: argoproj.io/v1beta1
kind: CronWorkflow
metadata:
  name: etcdsnapshot
  namespace: kagent
spec:
  schedule: "0 3 * * *"
  workflow:
    spec:
      serviceAccountName: argo
      entrypoint: etcd-snapshot
      templates:
        - name: etcd-snapshot
          container:
            name: etcdctl
            image: registry.k8s.io/kubectl:v1.37.2
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail

                _arch=$(uname -m | sed 's/aarch64/arm64/g' | sed 's/x86_64/amd64/g')
                _url="https://github.com/siderolabs/talos/releases/download/v1.14.2/talosctl-linux-${_arch}"

                mkdir -p /usr/local/bin/
                curl -fsSL -o /usr/local/bin/talosctl "${_url}"
                chmod +x /usr/local/bin/talosctl

                # Generate the snapshot file name with date
                today=$(date +%Y-%m-%d)
                snapshot_file="/backups/etcd-${today}.snapshot"

                echo "taking snapshot of etcd"...
                /usr/local/bin/talosctl --endpoints 192.168.1.22,192.168.1.24,192.168.1.25 etcd snapshot -o "${snapshot_file}"
                echo "snapshot saved to ${snapshot_file}"
                # Upload to S3
                /usr/local/bin/talosctl --endpoints 192.168.1.22,192.168.1.24,192.168.1.25 get secrets -o /tmp/secrets.enc
                echo "secrets encrypted backup saved"
                # Remove backups older than 30 days
                mc rb --force --newer 30d s3/etcd-backups || true

        - name: upload
          container:
            name: s3fs
            image: minio/s3fs
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail

                mkdir -p /tmp/s3fs
                s3fs minio /tmp/s3fs -o url=http://minio.minio:9000 -o access_key=${MINIO_ROOT_USER} -o secret_key=${MINIO_ROOT_PASSWORD}
                cp /backups/etcd-${today}.snapshot /tmp/s3fs/etcd-${today}.snapshot
