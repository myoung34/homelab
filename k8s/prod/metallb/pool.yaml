# LAN VIPs on the cluster VLAN. Below the UniFi DHCP pool (.100-.254) and
# above the node IPs. autoAssign off: a Service only gets one when it asks
# for a specific address with metallb.io/loadBalancerIPs.
#
#   192.168.1.50  traefik (LAN ingress, *.marcyoung.us)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
spec:
  addresses:
  - 192.168.1.50-192.168.1.59
  autoAssign: false
---
# L2: the node running a Service's endpoint answers ARP for its VIP, so the
# address follows the pod when it moves.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
spec:
  ipAddressPools:
  - lan
