apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: coder
    app.kubernetes.io/name: coder
  name: coder
  namespace: coder
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: coder
    app.kubernetes.io/name: coder
  type: ClusterIP
---
# Lets coderd (via the "default" SA, same one its VaultAuth authenticates as)
# create the workspace pods/PVCs/services when a Kubernetes workspace template
# is pushed. Scoped to this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coder-workspaces
  namespace: coder
rules:
- apiGroups: [""]
  resources:
  - pods
  - pods/log
  - pods/exec
  - persistentvolumeclaims
  - services
  - secrets
  - configmaps
  - events
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups: ["apps"]
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workspaces
  namespace: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coder-workspaces
subjects:
- kind: ServiceAccount
  name: default
  namespace: coder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: coder
  labels:
    app.kubernetes.io/instance: coder
    app.kubernetes.io/name: coder
  name: coder
  namespace: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: coder
      app.kubernetes.io/name: coder
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: coder
        app.kubernetes.io/name: coder
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: CODER_HTTP_ADDRESS
          value: "0.0.0.0:8080"
        - name: CODER_ACCESS_URL
          value: "https://coder.king-gila.ts.net"
        envFrom:
        - secretRef:
            name: coder
        image: "ghcr.io/coder/coder:latest"
        imagePullPolicy: IfNotPresent
        name: coder
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 512M
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 30
          initialDelaySeconds: 0
          periodSeconds: 5
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
      serviceAccountName: default
