# liams room motion and dark turn on stuff
- alias: Liams Room Motion Lights On
  id: liams_room_motion_lights_on
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.kids_room_motion
      to: "on"
  condition:
    - condition: time
      after: "20:00:00"
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.g4_instant_is_dark
          state: "on"
        - condition: state
          entity_id: binary_sensor.g4_instant_is_dark_2
          state: "on"
  action:
    - service: switch.turn_on
      target:
        entity_id:
          - switch.wall_1
          - switch.dnd_lights_lights

- alias: Liams Room Motion Lights Off At Midnight
  id: liams_room_motion_lights_off_midnight
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - service: switch.turn_off
      target:
        entity_id:
          - switch.wall_1
          - switch.dnd_lights_lights

# Assist: "download the movie Dune Part Two". Say the year for ambiguous
# titles ("the movie The Mummy 2026"). Logic lives in script.radarr_download_movie.
- alias: Assist Download Movie
  id: assist_download_movie
  mode: queued
  trigger:
    - platform: conversation
      command:
        - "download [the] movie {title}"
        - "(get|grab) [the] movie {title}"
  action:
    - service: script.radarr_download_movie
      data:
        title: "{{ trigger.slots.title }}"
      response_variable: result
    - set_conversation_response: "{{ result.message }}"
    - if: "{{ result.message.startswith('Downloading') }}"
      then:
        - service: rest_command.slack_notify
          data:
            message: "🎬 Assist: {{ result.message }}"

# "Hey Google, add Dune to my movies list". Google Assistant writes to the
# Keep list "movies"; google_keep_sync polls Keep and fires a call_service
# todo.add_item event (origin REMOTE) for each new item. Result goes to Slack
# since Google only says "added to your list"; the Keep item is ticked off.
- alias: Keep Movies List Download
  id: keep_movies_list_download
  mode: queued
  trigger:
    - platform: event
      event_type: call_service
      event_data:
        domain: todo
        service: add_item
  condition:
    - condition: template
      value_template: >
        {{ trigger.event.origin == 'REMOTE' and
           'todo.google_keep_movies' in (trigger.event.data.service_data.entity_id | default([])) }}
  action:
    - variables:
        item: "{{ trigger.event.data.service_data.item }}"
    - service: script.radarr_download_movie
      data:
        title: "{{ item }}"
      response_variable: result
    - service: rest_command.slack_notify
      data:
        message: "🎬 Keep list ({{ item }}): {{ result.message }}"
    - service: todo.update_item
      target:
        entity_id: todo.google_keep_movies
      data:
        item: "{{ item }}"
        status: completed
