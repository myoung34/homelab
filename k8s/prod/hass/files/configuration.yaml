homeassistant:
  name: Home
  latitude: 36.05176059430268
  longitude: -86.96233545971482
  elevation: 0
  time_zone: America/Chicago
  customize: !include customize.yaml
  allowlist_external_dirs:
    - /config
minio:
  host: 192.168.3.2
  port: 9000
  secure: false
  access_key: !secret minio_access_key
  secret_key: !secret minio_secret_key

zeroconf:

logger:
  default: error

default_config:

#http:
#  ip_ban_enabled: false
#  use_x_forwarded_for: true
#  trusted_proxies:
#    - 10.244.0.0/16
#    - 100.0.0.0/8
#    - 192.168.0.0/16

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml


google_assistant:
  project_id: something-99631
  service_account: !include SERVICE_ACCOUNT.json
  report_state: true
  exposed_domains: []
  entity_config: {}

recorder:
  purge_keep_days: 30
  db_url: !secret psql_connector_string
  db_retry_wait: 10 # Wait 10 seconds before retrying
  exclude:
    domains:
      - automation
      - updater
    entity_globs:
      - sensor.weather_*
    entities:
      - sun.sun # Don't record sun data
      - sensor.last_boot # Comes from 'systemmonitor' sensor platform
      - sensor.date
    event_types:
      - call_service # Don't record service calls

input_number:
  ecobee_setpoint:
    name: Ecobee Setpoint
    min: 60
    max: 85
    step: 1
    mode: box
    initial: 72

rest_command:
  # Assist "download the movie {title}" (automations.yaml). hass is on the
  # host network with ClusterFirstWithHostNet DNS, so the Service name works.
  radarr_lookup:
    url: "http://radarr.radarr.svc.cluster.local:7878/api/v3/movie/lookup?term={{ term | urlencode }}"
    method: GET
    headers:
      X-Api-Key: !secret radarr_api_key
    timeout: 20
  radarr_add:
    url: "http://radarr.radarr.svc.cluster.local:7878/api/v3/movie"
    method: POST
    content_type: application/json
    headers:
      X-Api-Key: !secret radarr_api_key
    timeout: 20
    # qualityProfileId 4 = HD-1080p (12 GiB cap); search right away.
    payload: >
      {
        "title": {{ movie.title | to_json }},
        "tmdbId": {{ movie.tmdbId }},
        "year": {{ movie.year }},
        "titleSlug": {{ movie.titleSlug | to_json }},
        "images": {{ movie.images | to_json }},
        "qualityProfileId": 4,
        "rootFolderPath": "/media/movies",
        "monitored": true,
        "minimumAvailability": "released",
        "addOptions": {"searchForMovie": true, "monitor": "movieOnly"}
      }
  # Same as radarr_* above, for "download the show {title}" and the Keep
  # "tv" list (script.sonarr_download_series).
  sonarr_lookup:
    url: "http://sonarr.sonarr.svc.cluster.local:8989/api/v3/series/lookup?term={{ term | urlencode }}"
    method: GET
    headers:
      X-Api-Key: !secret sonarr_api_key
    timeout: 20
  sonarr_add:
    url: "http://sonarr.sonarr.svc.cluster.local:8989/api/v3/series"
    method: POST
    content_type: application/json
    headers:
      X-Api-Key: !secret sonarr_api_key
    timeout: 20
    # qualityProfileId 4 = HD-1080p (100 MB/min cap). Season 1 now, plus
    # seasons that appear after the add; search right away.
    payload: >
      {
        "title": {{ show.title | to_json }},
        "tvdbId": {{ show.tvdbId }},
        "year": {{ show.year }},
        "titleSlug": {{ show.titleSlug | to_json }},
        "images": {{ show.images | to_json }},
        "seasons": {{ show.seasons | to_json }},
        "qualityProfileId": 4,
        "rootFolderPath": "/media/tv",
        "seasonFolder": true,
        "seriesType": "standard",
        "monitored": true,
        "monitorNewItems": "all",
        "addOptions": {"monitor": "firstSeason", "searchForMissingEpisodes": true}
      }
  sonarr_series:
    url: "http://sonarr.sonarr.svc.cluster.local:8989/api/v3/series/{{ id }}"
    method: GET
    headers:
      X-Api-Key: !secret sonarr_api_key
    timeout: 20
  slack_notify:
    url: !secret slack_webhook_url
    method: POST
    content_type: application/json
    payload: >
      {
        "message": "{{ message }}"
      }
