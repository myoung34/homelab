apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
metadata:
  name: argocd

resources:
 - namespace.yaml
 - vault.yaml
 - argocd.yaml
 - appset.yaml
 - app-actions-runner.yaml
 - sa-wf.yaml
 - tailscale.yaml
 - tailscale-wf.yaml
patches:
 - path: configmap.yaml

helmCharts:
- name: argo-cd
  releaseName: argocd
  namespace: argocd
  version: 10.17.2
  includeCRDs: true
  repo: https://argoproj.github.io/argo-helm
  valuesInline:
    configs:
      params:
        controller.sync.timeout.seconds: "600"
      secret:
        createSecret: false
    global:
      deploymentAnnotations:
        configmap.reloader.stakater.com/reload: "argocd-cm,argocd-rbac-cm"
    dex:
      enabled: false
    repoServer:
      metrics:
        enabled: true
      # This app is the only one that builds helm charts (argo-cd +
      # argo-workflows, both with CRDs). At 75m the pod's cpu.shares were low
      # enough that a busy node starved it, `kustomize build --enable-helm`
      # blew the 90s ARGOCD_EXEC_TIMEOUT, and the /healthz?full=true liveness
      # probe timed out too -> crash loop + cached ComparisonError.
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          value: 3m
      # Request stays above p95 (275m) on purpose, see above. Limit covers
      # the 1.4-core peak of a full helm build.
      resources:
        requests:
          cpu: 500m
          memory: 192Mi
        limits:
          cpu: 1400m
          memory: 480Mi
    applicationSet:
      webhook:
        ingress:
          enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 40Mi
        limits:
          cpu: 100m
          memory: 104Mi
      metrics:
        enabled: true
    notifications:
      metrics:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          cpu: 100m
          memory: 248Mi
    controller:
      metrics:
        enabled: true
      # Same starvation as repoServer: at 75m on a saturated node the Lua CRD
      # health checks (datadog/kagent/longhorn CRDs are huge) hit their
      # deadline -> ComparisonError "context deadline exceeded", health Unknown.
      resources:
        requests:
          cpu: 500m
          memory: 736Mi
        limits:
          cpu: 1200m
          memory: 1920Mi
    server:
      metrics:
        enabled: true
      extraArgs:
        - --insecure
      resources:
        requests:
          cpu: 95m
          memory: 144Mi
        limits:
          cpu: 250m
          memory: 256Mi
    redis:
      resources:
        requests:
          cpu: 20m
          memory: 56Mi
        limits:
          cpu: 100m
          memory: 72Mi
- name: argo-workflows
  releaseName: argocd-workflows
  namespace: argocd
  version: 2.0.18
  includeCRDs: true
  repo: https://argoproj.github.io/argo-helm
  valuesInline:
    controller:
      metrics:
        enabled: true
      logging:
        level: debug
      workflowNamespaces:
        - argocd
      resources:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          cpu: 100m
          memory: 144Mi
    server:
      metrics:
        enabled: true
      logging:
        level: debug
      extraArgs:
        - --insecure-skip-verify=true
      resources:
        requests:
          cpu: 10m
          memory: 120Mi
        limits:
          cpu: 100m
          memory: 152Mi
    workflow:
      logging:
        level: debug
      serviceAccount:
        create: true
        labels: {}
        name: "admin-user"
