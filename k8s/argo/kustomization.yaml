apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
metadata:
  name: argocd

resources:
 - namespace.yaml
 - vault.yaml
 - argocd.yaml
 - appset.yaml
 - app-actions-runner.yaml
 - sa-wf.yaml
 - tailscale.yaml
 - tailscale-wf.yaml
patches:
 - path: configmap.yaml

helmCharts:
- name: argo-cd
  releaseName: argocd
  namespace: argocd
  version: 10.10.2
  includeCRDs: true
  repo: https://argoproj.github.io/argo-helm
  valuesInline:
    configs:
      params:
        controller.sync.timeout.seconds: "600"
      secret:
        createSecret: false
    global:
      deploymentAnnotations:
        configmap.reloader.stakater.com/reload: "argocd-cm,argocd-rbac-cm"
    dex:
      enabled: false
    repoServer:
      metrics:
        enabled: true
      # This app is the only one that builds helm charts (argo-cd +
      # argo-workflows, both with CRDs). At 75m the pod's cpu.shares were low
      # enough that a busy node starved it, `kustomize build --enable-helm`
      # blew the 90s ARGOCD_EXEC_TIMEOUT, and the /healthz?full=true liveness
      # probe timed out too -> crash loop + cached ComparisonError.
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          value: 3m
      resources:
        requests:
          cpu: 500m
          memory: 256M
    applicationSet:
      webhook:
        ingress:
          enabled: false
      resources:
        requests:
          cpu: 23m
          memory: 105M
      metrics:
        enabled: true
    notifications:
      metrics:
        enabled: true
      resources:
        requests:
          cpu: 15m
          memory: 105M
    controller:
      metrics:
        enabled: true
      resources:
        requests:
          cpu: 75m
          memory: 298M
    server:
      metrics:
        enabled: true
      extraArgs:
        - --insecure
    redis:
      resources:
        requests:
          cpu: 15m
          memory: 105M
- name: argo-workflows
  releaseName: argocd-workflows
  namespace: argocd
  version: 2.0.12
  includeCRDs: true
  repo: https://argoproj.github.io/argo-helm
  valuesInline:
    controller:
      metrics:
        enabled: true
      logging:
        level: debug
      workflowNamespaces:
        - argocd
      resources:
        requests:
          cpu: 15m
          memory: 110M
    server:
      metrics:
        enabled: true
      logging:
        level: debug
      extraArgs:
        - --insecure-skip-verify=true
      resources:
        requests:
          cpu: 15m
          memory: 127M
    workflow:
      logging:
        level: debug
      serviceAccount:
        create: true
        labels: {}
        name: "admin-user"
