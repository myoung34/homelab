apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
metadata:
  name: argocd

resources:
 - namespace.yaml
 - vault.yaml
 - argocd.yaml
 - appset.yaml
 - app-actions-runner.yaml
 - sa-wf.yaml
 - tailscale.yaml
 - tailscale-wf.yaml
patches:
 - path: configmap.yaml

helmCharts:
- name: argo-cd
  releaseName: argocd
  namespace: argocd
  version: 10.20.0
  includeCRDs: true
  repo: https://argoproj.github.io/argo-helm
  valuesInline:
    configs:
      params:
        controller.sync.timeout.seconds: "600"
        # info logged ~241k lines/day (every reconcile: "Reconciliation
        # completed", "Update successful", ...). warn keeps errors and
        # health/sync failures.
        controller.log.level: warn
        # Same for the repo-server: ~144k lines/day of info, almost all
        # git fetch/checkout commands and "manifest cache hit" per refresh.
        reposerver.log.level: warn
      secret:
        createSecret: false
    global:
      deploymentAnnotations:
        configmap.reloader.stakater.com/reload: "argocd-cm,argocd-rbac-cm"
    dex:
      enabled: false
    # argocd-redis already exists (created 2026-07-22); the job only
    # re-checks it on every sync. It finishes and is deleted before the
    # starved controller sees it, failing every sync with "Job ... missing".
    redisSecretInit:
      enabled: false
    repoServer:
      metrics:
        enabled: true
      # This app is the only one that builds helm charts (argo-cd +
      # argo-workflows, both with CRDs). At 75m the pod's cpu.shares were low
      # enough that a busy node starved it, `kustomize build --enable-helm`
      # blew the 90s ARGOCD_EXEC_TIMEOUT, and the /healthz?full=true liveness
      # probe timed out too -> crash loop + cached ComparisonError.
      env:
        - name: ARGOCD_EXEC_TIMEOUT
          value: 3m
      # Request stays above p95 (275m) on purpose, see above. Limit covers
      # the 1.4-core peak of a full helm build.
      resources:
        requests:
          cpu: 500m
          memory: 192Mi
        limits:
          cpu: 1400m
          memory: 480Mi
    applicationSet:
      webhook:
        ingress:
          enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 40Mi
        limits:
          cpu: 100m
          memory: 104Mi
      metrics:
        enabled: true
    # No triggers, templates or subscriptions are configured
    # (argocd-notifications-cm holds only `context`), so the controller only
    # produced ~158k "Start processing"/"Processing completed" logs/day.
    notifications:
      enabled: false
    controller:
      metrics:
        enabled: true
      # Same starvation as repoServer: at 75m on a saturated node the Lua CRD
      # health checks (datadog/kagent/longhorn CRDs are huge) hit their
      # deadline -> ComparisonError "context deadline exceeded", health Unknown.
      resources:
        requests:
          cpu: 500m
          memory: 736Mi
        limits:
          cpu: 1200m
          memory: 1920Mi
    server:
      metrics:
        enabled: true
      extraArgs:
        - --insecure
      resources:
        requests:
          cpu: 95m
          memory: 144Mi
        limits:
          cpu: 250m
          memory: 256Mi
    redis:
      # The Datadog agent autodiscovers this as redisdb, but the
      # argocd-redis NetworkPolicy blocks it: every run timed out after ~58s
      # and logged an error. Its other metrics weren't used either.
      podAnnotations:
        ad.datadoghq.com/redis.metrics_exclude: "true"
      resources:
        requests:
          cpu: 20m
          memory: 56Mi
        limits:
          cpu: 100m
          memory: 72Mi
- name: argo-workflows
  releaseName: argocd-workflows
  namespace: argocd
  version: 2.0.19
  includeCRDs: true
  repo: https://argoproj.github.io/argo-helm
  valuesInline:
    controller:
      metrics:
        enabled: true
      logging:
        level: info
      workflowNamespaces:
        - argocd
      resources:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          cpu: 100m
          memory: 144Mi
    server:
      metrics:
        enabled: true
      logging:
        level: info
      extraArgs:
        - --insecure-skip-verify=true
      resources:
        requests:
          cpu: 10m
          memory: 120Mi
        limits:
          cpu: 100m
          memory: 152Mi
    workflow:
      logging:
        level: info
      serviceAccount:
        create: true
        labels: {}
        name: "admin-user"
