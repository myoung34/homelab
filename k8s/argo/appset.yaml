---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/myoung34/homelab'
        revision: HEAD
        directories:
          - path: "k8s/prod/*"
          - path: "k8s/prod/actions-runner"
            exclude: true
  template:
    metadata:
      name: "{{ path.basename }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/myoung34/homelab.git
        targetRevision: HEAD
        path: "k8s/prod/{{ path.basename }}"
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
          - FailOnSharedResource=true
          - RespectIgnoreDifferences=true
          - SkipDryRunOnMissingResource=true
        automated:
          prune: true
          selfHeal: true
      # The tailscale operator owns spec.externalName on egress Services: it
      # rewrites our required-but-meaningless "placeholder" to the proxy it
      # generates (ts-aperture-<random>.tailscale.svc.cluster.local). The
      # suffix is random and regenerated if the Service is recreated, so we
      # can't commit the real value - without this, coder sits OutOfSync and
      # selfHeal fights the operator every sync.
      #
      # Scoped to this one Service by name+namespace, so no other Service and
      # no other generated app is affected. That scoping only works here in
      # the Application spec; argocd-cm resource.customizations would match
      # every Service in the cluster. RespectIgnoreDifferences=true above is
      # what stops selfHeal reverting the field, not just hiding it in the UI.
      ignoreDifferences:
        - group: ""
          kind: Service
          name: aperture
          namespace: coder
          jsonPointers:
            - /spec/externalName
      revisionHistoryLimit: 5
