---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/myoung34/homelab'
        revision: HEAD
        directories:
          - path: "k8s/prod/*"
          - path: "k8s/prod/actions-runner"
            exclude: true
  template:
    metadata:
      name: "{{ path.basename }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/myoung34/homelab.git
        targetRevision: HEAD
        path: "k8s/prod/{{ path.basename }}"
        # Keep at most 4 old ReplicaSets per Deployment instead of the
        # Kubernetes default of 10. Applied here rather than per app so every
        # Deployment Argo renders gets it, including the ones helm charts
        # template. It does not reach Deployments that a controller creates
        # at runtime, e.g. kagent's per-Agent ones - the Agent CRD has no
        # field for it.
        kustomize:
          patches:
            - target:
                group: apps
                kind: Deployment
              patch: |-
                - op: add
                  path: /spec/revisionHistoryLimit
                  value: 4
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
          - FailOnSharedResource=true
          - RespectIgnoreDifferences=true
          - SkipDryRunOnMissingResource=true
        automated:
          prune: true
          selfHeal: true
      revisionHistoryLimit: 5
