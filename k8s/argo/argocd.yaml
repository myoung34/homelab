---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  source:
    path: k8s/argo
    repoURL: 'https://github.com/myoung34/homelab'
    targetRevision: HEAD
    # See the kustomize.patches comment in appset.yaml.
    kustomize:
      patches:
        - target:
            group: apps
            kind: Deployment
          patch: |-
            - op: add
              path: /spec/revisionHistoryLimit
              value: 4
  project: default
  syncPolicy:
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
