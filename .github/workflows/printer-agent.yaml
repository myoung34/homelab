name: printer-agent

# Tests on every change to apps/printer-agent; builds and pushes the image
# only from main, so merging the PR is what publishes it (same as Argo CD:
# the merge is the deploy).
on:
  push:
    paths:
      - "apps/printer-agent/**"
      - ".github/workflows/printer-agent.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/printer-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: timeout 300 uv run pytest -q -o faulthandler_timeout=60

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/printer-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/myoung34/printer-agent:latest
            ghcr.io/myoung34/printer-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
