# Builds images/ollama (stock Ollama + ollama/ollama#18433) and pushes it to
# ghcr.io/myoung34/homelab/ollama. Runs on any branch that touches the
# image, so the tag exists before the PR that uses it is merged.
name: ollama image

on:
  push:
    paths:
      - images/ollama/**
      - .github/workflows/ollama-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read OLLAMA_VERSION
        id: v
        run: echo "version=$(sed -n 's/^ARG OLLAMA_VERSION=//p' images/ollama/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/ollama
          pull: true
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/ollama:${{ steps.v.outputs.version }}-rocm-pr18433
          cache-from: type=gha
          cache-to: type=gha,mode=max
