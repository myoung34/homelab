name: Validate Talos config

# Renders every node's machine config the way terraform/talos builds it and
# runs `talosctl validate --strict` for local.talos_version. Uses a throwaway
# secrets bundle and placeholder Vault values, so no real secret is involved.
on:
  push:
    paths:
      - terraform/talos/**
      - .github/workflows/talos.yaml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.17.0
          # The wrapper rewrites stdout, which breaks `terraform console`.
          terraform_wrapper: false
      - run: terraform/talos/validate.sh
